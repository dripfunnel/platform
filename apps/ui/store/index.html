<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Store</title>
    <!-- Set before the first paint so a dark-mode machine never flashes the light default.
         The key is the one the user menu's Appearance choice writes (ui/README.md §4). -->
    <script>
      try {
        var c = localStorage.getItem('df-store-theme')
        if (c === 'dark' || (c !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.dataset.theme = 'dark'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
