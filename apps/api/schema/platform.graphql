type ActionPermission {
  allowed: Boolean
  reason: String
}

type GoLiveChecks {
  emailDomain: Boolean
  legalPages: Boolean
  portalHost: Boolean
  pricedPlan: Boolean
  testSignup: Boolean
}

type Me {
  email: String
  id: ID
  name: String
  partner: Partner
  role: String
}

type Money {
  amount: Int
  currency: String
}

input MoneyInput {
  amount: Int!
  currency: String!
}

type Mutation {
  createPlan(input: PlanInput!): PlanResult
  makePlanLive(id: ID!): PlanResult
  retirePlan(id: ID!, input: RetirePlanInput!): PlanResult
  submitForApproval: SubmitForApprovalResult
  updatePlan(applyTo: String, id: ID!, input: PlanInput!): PlanResult
}

type NavBadges {
  billingFailedPayments: Int
  brandingSetupLeft: Int
  domainsWaiting: Int
  storesAttention: Int
  supportOpenSessions: Int
}

type Onboarding {
  canSubmit: ActionPermission
  checks: GoLiveChecks
  fallbackSenderAccepted: Boolean
  fixes: [OnboardingFix!]
  items: [OnboardingItem!]
  sentBackReason: String
  submittedAt: String
  submittedBy: String
}

type OnboardingFix {
  item: String
  to: String
}

type OnboardingItem {
  detail: String
  doneBy: String
  key: String
  status: String
  to: String
}

type Partner {
  host: String
  id: ID
  name: String
  product: String
  state: String
}

type PartnerState {
  brokenHosts: [String!]
  pauseReason: String
  pausedAt: String
  sentBackReason: String
  setupSession: SetupSessionNotice
  state: String
  storeCount: Int
}

type Plan {
  entitlements: PlanEntitlements
  row: PlanRow
}

type PlanCeilings {
  ai: Int
  currencies: Int
  languages: Int
  products: Int
  publish: Int
  staff: Int
  suppliers: Int
}

type PlanEditor {
  ceilings: PlanCeilings
  chargedBy: String
  currencies: [String!]
  edit: PlanPermission
  plan: Plan
  powered: PoweredByRule
  price: PlanPermission
  retireDates: [String!]
  retireTargets: [RetireTarget!]
  trials: [Int!]
}

type PlanEntitlements {
  ai: Int
  aplus: Boolean
  currencies: Int
  domain: Boolean
  languages: Int
  offers: Boolean
  powered: Boolean
  products: Int
  publish: Int
  size: Boolean
  staff: Int
  suppliers: Int
  suppliersOn: Boolean
}

input PlanEntitlementsInput {
  ai: Int!
  aplus: Boolean!
  currencies: Int!
  domain: Boolean!
  languages: Int!
  offers: Boolean!
  powered: Boolean!
  products: Int!
  publish: Int!
  size: Boolean!
  staff: Int!
  suppliers: Int!
  suppliersOn: Boolean!
}

input PlanInput {
  description: String!
  entitlements: PlanEntitlementsInput!
  name: String!
  prices: [PlanPriceInput!]!
  trialDays: Int!
}

type PlanMargin {
  amount: Money
  kind: String
  of: Money
}

type PlanPermission {
  allowed: Boolean
  reason: String
}

type PlanPrice {
  converted: Boolean
  currency: String
  fee: Money
  margin: PlanMargin
  monthly: Money
  yearly: Money
}

input PlanPriceInput {
  currency: String!
  monthly: MoneyInput
  yearly: MoneyInput
}

type PlanResult {
  currency: String
  id: String
  ok: Boolean
  reason: String
  row: String
}

type PlanRow {
  description: String
  id: ID
  name: String
  prices: [PlanPrice!]
  status: String
  stores: Int
  trialDays: Int
}

type PlansPage {
  chargedBy: String
  create: PlanPermission
  items: [PlanRow!]
}

type PoweredByRule {
  allowed: Boolean
  note: String
}

type Query {
  health: String
  me: Me
  navBadges: NavBadges
  onboarding: Onboarding
  partnerState: PartnerState
  planEditor(id: ID): PlanEditor
  plans: PlansPage
  quotePlanPrices(id: ID, prices: [PlanPriceInput!]!): [PlanPrice!]
  search(query: String!): [StoreSearchMatch!]
}

input RetirePlanInput {
  keep: Boolean!
  moveTo: ID
  on: String
}

type RetireTarget {
  id: ID
  name: String
}

type SetupSessionNotice {
  endsAt: String
  staffName: String
}

type StoreSearchMatch {
  code: String
  domain: String
  id: ID
  name: String
  ownerEmail: String
  status: String
}

type SubmitForApprovalResult {
  check: String
  code: String
  ok: Boolean
  submittedAt: String
}
