type ActingStore {
  permissions: [String!]
  plan: Named
  role: String
  seller: Named
  store: Named
  tier: String
}

type Brand {
  accentColor: String
  background: String
  corner: String
  files: BrandFiles
  font: String
  helpUrl: String
  poweredBy: Boolean
  primaryColor: String
  privacyUrl: String
  productName: String
  supportEmail: String
  supportUrl: String
  termsUrl: String
}

type BrandFiles {
  favicon: String
  logoDark: String
  logoLight: String
  mark: String
}

type Me {
  acting: ActingStore
  email: String
  id: ID
  name: String
}

type Money {
  amount: String
  currency: String
}

input MoneyInput {
  amount: String!
  currency: String!
}

type Mutation {
  changeEmail(email: String!, password: String!): Boolean
  changePassword(current: String!, next: String!): Boolean
  changeRole(membershipId: ID!, role: String!): Boolean
  deleteProducts(ids: [ID!]!): Int
  duplicateProduct(id: ID!): SavedProduct
  inviteMember(email: String!, role: String!): Boolean
  regenerateBackupCodes: [String!]
  removeMember(membershipId: ID!): Boolean
  resendInvitation(invitationId: ID!): Boolean
  revokeInvitation(invitationId: ID!): Boolean
  saveProduct(id: ID, input: ProductInput!, revision: Int): SavedProduct
  setSecondFactor(code: String, method: String!, password: String): SecondFactorStep
  signOutOtherSessions: Int
  switchStore(storeId: ID!, supplierId: ID): StoreChoice
  updateProducts(ids: [ID!]!, patch: ProductsPatch!): Int
  updateProfile(name: String!, phone: String, theme: String): Profile
}

type MyActivity {
  nodes: [MyActivityEntry!]
  pageInfo: PageInfo
}

type MyActivityEntry {
  action: String
  id: ID
  occurredAt: String
  result: String
  storeId: String
  target: MyActivityTarget
}

type MyActivityTarget {
  label: String
  type: String
}

type Named {
  id: ID
  name: String
}

type PageInfo {
  endCursor: String
  hasNextPage: Boolean
  hasPreviousPage: Boolean
  startCursor: String
}

type Product {
  approval: String
  category: String
  createdAt: String
  description: String
  id: ID
  name: String
  options: [ProductOption!]
  photos: [ProductPhoto!]
  pricingCurrency: String
  productType: String
  returnsText: String
  revision: Int
  sentBackReason: String
  seoDescription: String
  seoTitle: String
  shared: Boolean
  slug: String
  supplier: ProductSupplier
  updatedAt: String
  versions: [ProductVersion!]
  video: ProductVideo
  visible: Boolean
  warrantyText: String
}

type ProductCounts {
  all: Int
  hidden: Int
  missingInfo: Int
  pending: Int
  sentBack: Int
  visible: Int
}

input ProductInput {
  category: String
  description: String
  name: String!
  options: [ProductOptionInput!]!
  photos: [ProductPhotoInput!]
  productType: String
  returnsText: String
  seoDescription: String
  seoTitle: String
  slug: String
  versions: [ProductVersionInput!]!
  video: ProductVideoInput
  visible: Boolean
  warrantyText: String
}

type ProductOption {
  id: ID
  name: String
  values: [ProductOptionValue!]
}

input ProductOptionInput {
  id: ID
  name: String!
  values: [ProductOptionValueInput!]!
}

type ProductOptionValue {
  id: ID
  name: String
}

input ProductOptionValueInput {
  id: ID
  name: String!
}

type ProductPage {
  nodes: [ProductSummary!]
  pageInfo: PageInfo
}

type ProductPhoto {
  alt: String
  assetId: ID
  height: Int
  id: ID
  url: String
  versionId: ID
  width: Int
}

input ProductPhotoInput {
  alt: String
  assetId: String!
  version: Int
}

type ProductSummary {
  approval: String
  buyable: Boolean
  createdAt: String
  id: ID
  maxPrice: Money
  minPrice: Money
  name: String
  photoUrl: String
  productType: String
  slug: String
  supplier: ProductSupplier
  supplierRemoved: Boolean
  updatedAt: String
  versionCount: Int
  visible: Boolean
}

type ProductSupplier {
  id: ID
  name: String
}

type ProductVersion {
  barcode: String
  choices: [String!]
  continueSelling: Boolean
  cost: Money
  customsDescription: String
  heightMm: Int
  hsCode: String
  id: ID
  lengthMm: Int
  name: String
  prices: [VersionPrice!]
  sku: String
  trackStock: Boolean
  visible: Boolean
  weightGrams: Int
  widthMm: Int
}

input ProductVersionInput {
  barcode: String
  choices: [String!]!
  continueSelling: Boolean
  cost: MoneyInput
  customsDescription: String
  heightMm: Int
  hsCode: String
  id: ID
  lengthMm: Int
  name: String
  prices: [VersionPriceInput!]!
  sku: String
  trackStock: Boolean
  visible: Boolean
  weightGrams: Int
  widthMm: Int
}

type ProductVideo {
  assetId: ID
  uploaded: Boolean
  url: String
}

input ProductVideoInput {
  assetId: String
  url: String
}

input ProductsPatch {
  visible: Boolean!
}

type Profile {
  email: String
  name: String
  passwordChangedAt: String
  pendingEmail: String
  phone: String
  theme: String
  twoFactor: TwoFactor
}

type Provisioning {
  state: String
  step: String
}

type Query {
  brand: Brand
  health: String
  me: Me
  myActivity(after: String, before: String, first: Int): MyActivity
  mySessions: [SignedInSession!]
  myStores(after: String, before: String, first: Int): StoreChoices
  people(after: String, before: String, filter: String, first: Int): StorePeople
  peopleCounts: StorePeopleCounts
  product(id: ID!): Product
  productCounts: ProductCounts
  products(after: String, before: String, filter: String, first: Int, search: String, supplier: String): ProductPage
  profile: Profile
  storeState: StoreState
}

type SavedProduct {
  id: ID
  revision: Int
  slug: String
}

type SecondFactorStep {
  backupCodes: [String!]
  done: Boolean
  hint: String
  secret: String
  uri: String
}

type SignedInSession {
  createdAt: String
  current: Boolean
  device: String
  lastUsedAt: String
}

type StoreChoice {
  membershipId: ID
  role: String
  seller: Named
  store: Named
  tier: String
}

type StoreChoices {
  nodes: [StoreChoice!]
  pageInfo: PageInfo
}

type StorePeople {
  nodes: [StorePerson!]
  pageInfo: PageInfo
}

type StorePeopleCounts {
  staff: Int
  waiting: Int
}

type StorePerson {
  email: String
  expired: Boolean
  expiresAt: String
  id: ID
  kind: String
  name: String
  role: String
  since: String
  you: Boolean
}

type StoreState {
  pastDueSince: String
  provisioning: Provisioning
  readOnly: Boolean
  status: String
  support: SupportBanner
  trialEndsAt: String
}

type SupportBanner {
  agentFirstName: String
  endsAt: String
  partnerName: String
}

type TwoFactor {
  backupCodesLeft: Int
  method: String
  required: Boolean
}

type VersionPrice {
  amount: String
  compareAtAmount: String
  currency: String
}

input VersionPriceInput {
  amount: String!
  compareAtAmount: String
  currency: String!
}
