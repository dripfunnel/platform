type ActingStore {
  permissions: [String!]
  plan: Named
  role: String
  seller: Named
  store: Named
  tier: String
}

type Brand {
  accentColor: String
  background: String
  corner: String
  files: BrandFiles
  font: String
  helpUrl: String
  poweredBy: Boolean
  primaryColor: String
  privacyUrl: String
  productName: String
  supportEmail: String
  supportUrl: String
  termsUrl: String
}

type BrandFiles {
  favicon: String
  logoDark: String
  logoLight: String
  mark: String
}

type Me {
  acting: ActingStore
  email: String
  id: ID
  name: String
}

type Mutation {
  changeEmail(email: String!): Boolean
  changePassword(current: String!, next: String!): Boolean
  regenerateBackupCodes: [String!]
  setSecondFactor(code: String, method: String!, password: String): SecondFactorStep
  signOutOtherSessions: Int
  switchStore(storeId: ID!, supplierId: ID): StoreChoice
  updateProfile(name: String!, phone: String, theme: String): Profile
}

type MyActivity {
  nodes: [MyActivityEntry!]
  pageInfo: PageInfo
}

type MyActivityEntry {
  action: String
  id: ID
  occurredAt: String
  result: String
  storeId: String
  target: MyActivityTarget
}

type MyActivityTarget {
  label: String
  type: String
}

type Named {
  id: ID
  name: String
}

type PageInfo {
  endCursor: String
  hasNextPage: Boolean
  hasPreviousPage: Boolean
  startCursor: String
}

type Profile {
  email: String
  name: String
  passwordChangedAt: String
  pendingEmail: String
  phone: String
  theme: String
  twoFactor: TwoFactor
}

type Provisioning {
  state: String
  step: String
}

type Query {
  brand: Brand
  health: String
  me: Me
  myActivity(after: String, before: String, first: Int): MyActivity
  mySessions: [SignedInSession!]
  myStores(after: String, before: String, first: Int): StoreChoices
  profile: Profile
  storeState: StoreState
}

type SecondFactorStep {
  backupCodes: [String!]
  done: Boolean
  hint: String
  secret: String
  uri: String
}

type SignedInSession {
  createdAt: String
  current: Boolean
  device: String
  lastUsedAt: String
}

type StoreChoice {
  membershipId: ID
  role: String
  seller: Named
  store: Named
  tier: String
}

type StoreChoices {
  nodes: [StoreChoice!]
  pageInfo: PageInfo
}

type StoreState {
  pastDueSince: String
  provisioning: Provisioning
  readOnly: Boolean
  status: String
  support: SupportBanner
  trialEndsAt: String
}

type SupportBanner {
  agentFirstName: String
  endsAt: String
  partnerName: String
}

type TwoFactor {
  backupCodesLeft: Int
  method: String
  required: Boolean
}
