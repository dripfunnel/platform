<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="padding:{{ pad }};display:flex;flex-direction:column;gap:14px;max-width:960px;">
  <input type="file" ref="{{ fileRef }}" accept=".csv,.txt,.xlsx" onChange="{{ onFile }}" style="display:none;">
  <sc-for list="{{ cards }}" as="cd" hint-placeholder-count="2">
    <div style="background:var(--card,#FFFFFF);border:1px solid var(--border,#E8E2DC);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;"><span style="display:flex;flex-direction:column;gap:2px;"><span style="font-family:Manrope,sans-serif;font-weight:700;font-size:16px;">{{ cd.title }}</span><span style="font-size:13px;color:var(--muted,#5A6472);">{{ cd.sub }}</span></span><sc-if value="{{ cd.headBtn }}" hint-placeholder-val="{{ false }}"><button onClick="{{ cd.headOn }}" style="height:36px;padding:0 14px;border:1px solid var(--field,#D7D3CD);border-radius:8px;background:var(--card,#FFFFFF);font-size:13px;cursor:pointer;">{{ cd.headBtn }}</button></sc-if></div>
      <sc-for list="{{ cd.rows }}" as="r" hint-placeholder-count="3">
        <div style="display:flex;align-items:center;gap:12px;padding:10px 12px;border:{{ r.bd }};border-radius:10px;background:{{ r.bg }};flex-wrap:wrap;">
          <sc-if value="{{ r.radio }}" hint-placeholder-val="{{ false }}"><button onClick="{{ r.onClick }}" style="width:18px;height:18px;border-radius:50%;border:{{ r.dot }};background:var(--card,#FFFFFF);cursor:pointer;padding:0;flex:none;"></button></sc-if>
          <sc-if value="{{ r.mark }}" hint-placeholder-val="{{ false }}"><span style="width:34px;height:34px;border-radius:8px;background:var(--sunk,#F2F0EC);display:flex;align-items:center;justify-content:center;font-family:Manrope,sans-serif;font-weight:800;font-size:12px;color:var(--text2,#434A55);flex:none;">{{ r.mark }}</span></sc-if>
          <span style="flex:1;min-width:180px;display:flex;flex-direction:column;"><strong style="font-family:Manrope,sans-serif;font-size:14px;color:var(--text,#14181F);">{{ r.name }}</strong><span style="font-size:12px;color:var(--muted,#5A6472);">{{ r.desc }}</span></span>
          <sc-if value="{{ r.input }}" hint-placeholder-val="{{ false }}"><span style="display:flex;align-items:center;gap:4px;border:1px solid var(--field,#D7D3CD);border-radius:8px;padding:0 10px;height:36px;background:var(--card,#FFFFFF);"><span style="font-size:13px;color:var(--muted,#5A6472);">{{ r.prefix }}</span><input value="{{ r.value }}" onChange="{{ r.onInput }}" style="width:80px;border:0;outline:none;font-size:14px;"></span></sc-if>
          <sc-if value="{{ r.status }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;font-weight:600;padding:2px 10px;border-radius:10px;background:{{ r.stBg }};color:{{ r.stFg }};">{{ r.status }}</span></sc-if>
          <sc-if value="{{ r.btn }}" hint-placeholder-val="{{ false }}"><button onClick="{{ r.btnOn }}" style="height:34px;padding:0 12px;border:1px solid {{ r.btnBd }};border-radius:8px;background:var(--card,#FFFFFF);color:{{ r.btnFg }};font-size:13px;font-family:Manrope,sans-serif;font-weight:600;cursor:pointer;">{{ r.btn }}</button></sc-if>
        </div>
      </sc-for>
      <sc-if value="{{ cd.note }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;color:var(--muted,#5A6472);">{{ cd.note }}</span></sc-if>
      <sc-if value="{{ cd.save }}" hint-placeholder-val="{{ false }}"><div style="display:flex;justify-content:flex-end;"><button onClick="{{ cd.saveOn }}" style="height:40px;padding:0 18px;border:0;border-radius:8px;background:{{ cd.saveBg }};color:#FFFFFF;font-family:Manrope,sans-serif;font-weight:700;font-size:14px;cursor:pointer;">{{ cd.save }}</button></div></sc-if>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  constructor(props) { super(props); this.fileRef = React.createRef(); this.state = { ship: JSON.parse(JSON.stringify(props.app.data('shipping') || {})), inv: { ...(props.app.data('invoiceSettings') || { perLine: true, email: true, label: props.app.R.key === 'US' ? 'Tax' : props.app.R.taxName }) }, testing: false }; }
  readCodes(e) { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return; const app = this.props.app; if (!/\.(csv|txt)$/i.test(f.name)) { app.toast(f.name + ' isn’t a CSV or text file — save it as CSV and try again'); return; } const r = new FileReader(); r.onload = () => { const codes = [...new Set(String(r.result).split(/[\s,;]+/).map(x => x.trim().toUpperCase()).filter(x => /^[A-Z0-9][A-Z0-9 -]{2,9}$/.test(x) && /\d/.test(x)))]; if (!codes.length) { app.toast('We couldn’t find any ' + app.R.postalLabel + 's in ' + f.name); return; } this.setState({ ship: { ...this.state.ship, where: 'list', postcodes: { name: f.name, count: codes.length, sample: codes.slice(0, 3) } } }); app.toast(codes.length + ' ' + app.R.postalLabel + 's read from ' + f.name + ' — save to use them'); }; r.readAsText(f); }
  renderVals() {
    const app = this.props.app; if (!app) return {};
    const { R, fmt, caps: c, phone } = app; const mode = this.props.mode; const s = this.state;
    const ro = !c.isOwner || c.readOnly;
    const row = x => ({ radio: false, mark: '', input: false, status: '', btn: '', bd: '1px solid var(--border,#EDEAE5)', bg: 'var(--card,#FFFFFF)', stBg: 'var(--sunk,#F2F0EC)', stFg: 'var(--text2,#434A55)', btnBd: 'var(--field,#D7D3CD)', btnFg: 'var(--text,#14181F)', desc: '', ...x });
    const pad = phone ? '14px' : '22px 28px';
    const fx = { fileRef: this.fileRef, onFile: e => this.readCodes(e) };
    if (mode === 'payments') {
      const gws = app.data('gateways') || [];
      const live = gws.filter(g => g.status === 'live');
      const setG = (k, st) => app.set('gateways', l => l.map(g => g.key === k ? { ...g, status: st } : g));
      const connect = g => (g.kind === 'extra' || app.within('gateways', live.filter(x => x.kind === 'gateway').length, 'Payment gateways')) && app.modal({ title: 'Connect ' + g.name, body: g.kind === 'extra' ? g.desc : `Paste the keys from your ${g.name} dashboard. The secret is saved and never shown again.`, ...(g.kind === 'extra' ? {} : { input: { label: 'API key', placeholder: g.key + '_live_…', required: true, error: 'Paste your key' } }), confirm: g.kind === 'extra' ? 'Turn on' : 'Connect', onConfirm: () => { setG(g.key, 'live'); app.toast(g.name + (g.kind === 'extra' ? ' is on at checkout' : ' connected — shoppers can pay with it now')); } });
      const mk = g => row({ mark: g.name.slice(0, 2).toUpperCase(), name: g.name, desc: g.desc, status: g.status === 'live' ? 'Live' : 'Not connected', stBg: g.status === 'live' ? 'var(--okbg,#EEF7F2)' : 'var(--sunk,#F2F0EC)', stFg: g.status === 'live' ? 'var(--okfg,#1D6B47)' : 'var(--muted,#5A6472)', btn: ro ? '' : g.status === 'live' ? (g.kind === 'extra' ? 'Turn off' : 'Disconnect') : (g.kind === 'extra' ? 'Set up' : 'Connect'), btnOn: () => { if (g.status !== 'live') { connect(g); return; } if (live.length <= 1) { app.toast('You can’t turn off your only way to get paid — shoppers couldn’t buy anything'); return; } app.modal({ title: 'Turn off ' + g.name + '?', body: 'Shoppers stop seeing it at checkout. Orders already paid aren’t affected.', confirm: 'Turn off', onConfirm: () => { setG(g.key, 'off'); app.toast(g.name + ' turned off'); } }); } });

        ...(gws.some(g => g.kind === 'extra') ? [{ title: 'Other ways to get paid', sub: 'Orders paid this way stay “Payment pending” until you mark them paid.', rows: gws.filter(g => g.kind === 'extra').map(mk) }] : [])

    }

      const radio = (on, name, desc, fn, extra) => row({ radio: true, dot: on ? '5px solid var(--focus,#00519F)' : '1.5px solid var(--faint,#9AA1AB)', bd: on ? '2px solid var(--focus,#00519F)' : '1px solid var(--border,#EDEAE5)', bg: on ? 'var(--ibg,#F4F8FB)' : 'var(--card,#FFFFFF)', name, desc, onClick: () => !ro && fn(), ...(extra || {}) });
      const pricing = sh.couriers.find(x => x.status === 'pricing');
      const ST = { pricing: ['Pricing orders', 'var(--okbg,#EEF7F2)', 'var(--okfg,#1D6B47)'], standby: ['Standby', 'var(--sunk,#F2F0EC)', 'var(--text2,#434A55)'], failed: ['Login rejected', 'var(--pbg,#FDF0E8)', 'var(--link,#B8541F)'], off: ['Not connected', 'var(--sunk,#F2F0EC)', 'var(--muted,#5A6472)'] };
      const setCour = (n, st) => set({ couriers: sh.couriers.map(x => x.name === n ? { ...x, status: st } : (st === 'pricing' && x.status === 'pricing' ? { ...x, status: 'standby' } : x)) });
      const info = app.data('storeInfo') || {};
      const testAll = () => { this.setState({ testing: true }); setTimeout(() => { this.setState({ testing: false }); const on = sh.couriers.filter(x => x.status !== 'off'); const bad = on.filter(x => x.status === 'failed'); set({ couriers: sh.couriers.map(x => x.status === 'off' ? x : { ...x, tested: Date.now() }) }); app.modal({ tag: 'Test results', title: bad.length ? bad.length + ' of ' + on.length + ' didn’t answer' : 'All ' + on.length + ' answered', body: on.map(x => (x.status === 'failed' ? '✕ ' : '✓ ') + x.name + ' — ' + (x.status === 'failed' ? 'login rejected. Reconnect it with a new account key.' : 'quoted a test parcel to ' + info.city + ' in ' + (0.4 + on.indexOf(x) * 0.3).toFixed(1) + ' s')).join('\n'), confirm: 'OK', cancel: '' }); }, 1200); };

        const upd = patch => { const next = { ...sh, couriers: sh.couriers.map(y => y.name === x.name ? { ...y, ...patch } : y) }; this.setState({ ship: next }); app.set('shipping', next); };
        if (v === 'pickup') { upd({ pickup: x.pickup === 'on request' ? 'daily, 2–5 pm' : 'on request' }); app.toast(x.name + ' pickups: ' + (x.pickup === 'on request' ? 'every working day, 2–5 pm' : 'you book each one from the order')); }
        if (v === 'label') { const L = R.key === 'US' ? ['4 × 6 in', 'Letter'] : ['A6', 'A4']; const cur = x.label || L[0]; upd({ label: cur === L[0] ? L[1] : L[0] }); app.toast('Labels now print on ' + (cur === L[0] ? L[1] : L[0])); }
        if (v === 'mail') { upd({ trackMail: x.trackMail === false }); app.toast('Tracking emails ' + (x.trackMail === false ? 'on' : 'off')); }
        if (v === 'off') { const nx = sh.couriers.find(y => y.name !== x.name && y.status === 'standby'); upd({ status: 'off' }); if (nx) { const next = { ...sh, couriers: sh.couriers.map(y => y.name === x.name ? { ...y, status: 'off' } : y.name === nx.name ? { ...y, status: 'pricing' } : y) }; this.setState({ ship: next }); app.set('shipping', next); } app.toast(x.name + ' disconnected' + (nx ? ' — ' + nx.name + ' prices orders now' : '')); }
      } });
      return { ...fx, pad, cards: [
        { title: 'What the shopper pays for delivery', sub: 'Two questions: what you charge, and when it’s free.', rows: [
          radio(sh.mode === 'live', 'The courier’s live rate', pricing ? `Quoted at checkout by ${pricing.name}, from address and weight.` : 'Connect a courier below first.', () => { if (!app.allow('liveRates', 'Live courier rates at checkout')) return; set({ mode: 'live' }); }),
          radio(sh.mode === 'flat', 'A flat rate', 'Same charge on every order.', () => set({ mode: 'flat' }), sh.mode === 'flat' ? { input: true, prefix: R.cur, value: sh.flat, onInput: e => set({ flat: e.target.value }) } : {}),
          radio(sh.mode === 'pickup', 'Nothing — collect in person', sh.mode === 'pickup' ? 'Shown at checkout: ' + [info.street, info.city].filter(Boolean).join(', ') + ' · ' + (sh.pickupHours || 'no hours set yet') : 'Your address and hours show at checkout instead.', () => set({ mode: 'pickup' }), sh.mode === 'pickup' && !ro ? { btn: sh.pickupHours ? 'Change hours' : 'Set hours', btnBd: sh.pickupHours ? 'var(--field,#D7D3CD)' : 'var(--pbd,#F0D4BF)', btnFg: sh.pickupHours ? 'var(--text,#14181F)' : 'var(--link,#B8541F)', btnOn: () => app.modal({ title: 'When can shoppers collect?', body: 'Shown at checkout and in the order confirmation.', value: sh.pickupHours || '', input: { label: 'Days and hours', placeholder: 'Mon–Sat, 10 am – 6 pm', required: true, error: 'Type when you’re open' }, confirm: 'Save hours', onConfirm: v => set({ pickupHours: v.trim() }) }) } : {})
        ] },
        { title: 'When is delivery free?', sub: '', rows: [
          radio(sh.free === 'never', 'Never — always charge', '', () => set({ free: 'never' })), radio(sh.free === 'always', 'Always — you pay for it', '', () => set({ free: 'always' })),
          radio(sh.free === 'over', 'On orders over an amount', sh.free === 'over' ? `A ${fmt(Number(sh.threshold) - 1)} basket pays; ${fmt(Number(sh.threshold))} ships free.` : '', () => set({ free: 'over' }), sh.free === 'over' ? { input: true, prefix: R.cur, value: sh.threshold, onInput: e => set({ threshold: e.target.value }) } : {})
        ] },
        { title: 'Delivery partners', sub: 'They quote rates, book pickups and send tracking.', headBtn: ro ? '' : this.state.testing ? 'Testing…' : 'Test all', headOn: () => !this.state.testing && testAll(),
          rows: sh.couriers.map(x => row({ mark: x.name.slice(0, 2).toUpperCase(), name: x.name, desc: x.status === 'failed' ? 'Its login was rejected since yesterday. Orders fall back to the next partner.' : x.status === 'pricing' ? 'Quotes every order at checkout · pickups ' + (x.pickup || 'daily, 2–5 pm') + ' · labels ' + (x.label || (R.key === 'US' ? '4 × 6 in' : 'A6')) + (x.tested ? ' · tested just now' : '') : x.status === 'standby' ? 'Connected, not quoting.' : '', status: ST[x.status][0], stBg: ST[x.status][1], stFg: ST[x.status][2],
            btn: ro ? '' : x.status === 'failed' ? 'Fix' : x.status === 'off' ? 'Connect' : x.status === 'standby' ? 'Use for pricing' : 'Manage', btnBd: x.status === 'failed' ? 'var(--pbd,#F0D4BF)' : 'var(--field,#D7D3CD)', btnFg: x.status === 'failed' ? 'var(--link,#B8541F)' : 'var(--text,#14181F)',
            btnOn: () => { if (x.status === 'pricing') { manage(x); return; } if (x.status === 'standby') { setCour(x.name, 'pricing'); return; } if (x.status === 'off' && !app.within('couriers', sh.couriers.filter(y => y.status !== 'off').length, 'Couriers')) return; app.modal({ title: (x.status === 'failed' ? 'Reconnect ' : 'Connect ') + x.name, input: { label: 'Account key from ' + x.name, placeholder: 'Paste it here', required: true, error: 'Paste your key' }, confirm: 'Connect', onConfirm: () => { setCour(x.name, 'standby'); app.toast(x.name + ' connected'); } }); } })),
          note: 'Fallback order: the pricing partner → the next connected one → your flat rate.' },
        { title: 'Where you deliver', sub: '', rows: [radio(sh.where === 'all', 'Everywhere my couriers reach', 'In the countries set up in Markets.', () => set({ where: 'all' })), radio(sh.where === 'list', `Only ${R.postalLabel}s I upload`, 'A shopper outside your area is told at the address step, not at payment.', () => set({ where: 'list' }), sh.where === 'list' ? { desc: sh.postcodes ? sh.postcodes.name + ' · ' + sh.postcodes.count.toLocaleString(R.locale) + ' codes, e.g. ' + sh.postcodes.sample.join(', ') : 'No list yet — until you upload one, every address is accepted.', btn: ro ? '' : sh.postcodes ? 'Replace list' : 'Upload list', btnOn: () => this.fileRef.current && this.fileRef.current.click() } : {})],
          save: ro ? '' : 'Save shipping', saveBg: dirty ? '#EC844F' : 'var(--off,#C9CDD3)', saveOn: () => { if (!dirty) return; if (sh.mode === 'flat' && !(Number(sh.flat) >= 0)) { app.toast('Type a flat rate'); return; } if (sh.mode === 'pickup' && !sh.pickupHours) { app.toast('Set your collection hours first — shoppers need to know when to come'); return; } if (sh.where === 'list' && !sh.postcodes) { app.toast('Upload your ' + R.postalLabel + ' list, or choose “Everywhere”'); return; } app.set('shipping', sh); app.set('shippingSet', true); app.toast('Shipping saved — checkout uses it now'); } }
      ] };
    }
    if (mode === 'warehouse') {
      const ws = app.data('warehouses') || [];
      const own = ws.filter(w => !w.supplier); const theirs = ws.filter(w => w.supplier);
      const add = () => app.within('locations', own.length, 'Stock locations') && app.modal({ title: 'Add a location', body: 'Somewhere your own stock sits. Adding it doesn’t move stock — it starts at zero.', input: { label: 'Name and address', placeholder: 'e.g. Back room, 12 High St', required: true, error: 'Give it a name' }, confirm: 'Add location', onConfirm: v => { app.set('warehouses', l => [...l, { id: 'w' + Date.now(), name: v.split(',')[0].trim(), addr: v.split(',').slice(1).join(',').trim() || R.city, units: 0, isDefault: false }]); app.toast(v.split(',')[0].trim() + ' added'); } });
      const manageW = w => app.modal({ title: w.name, body: w.addr, choices: [...(w.isDefault ? [] : [{ label: 'Make default', sub: 'New products start here. Existing stock doesn’t move.', value: 'def' }]), { label: 'Rename or change address', value: 'edit' }, ...(w.isDefault ? [] : [{ label: 'Delete', sub: w.units ? w.units + ' units are here — move them first' : 'Nothing is stored here', value: 'del' }])], confirm: 'Continue', onConfirm: v => {
        if (v === 'def') { app.set('warehouses', l => l.map(x => x.supplier ? x : { ...x, isDefault: x.id === w.id })); app.toast(w.name + ' is now the default — existing stock doesn’t move'); }
        if (v === 'edit') setTimeout(() => app.modal({ title: 'Edit ' + w.name, value: w.name + ', ' + w.addr, input: { label: 'Name, then address', placeholder: 'Back room, 12 High St', required: true, error: 'Give it a name' }, confirm: 'Save', onConfirm: val => { app.set('warehouses', l => l.map(x => x.id === w.id ? { ...x, name: val.split(',')[0].trim(), addr: val.split(',').slice(1).join(',').trim() || x.addr } : x)); app.toast('Saved — labels and pick lists use the new details'); } }), 30);
        if (v === 'del') { if (w.units) { app.toast(w.name + ' still holds ' + w.units.toLocaleString(R.locale) + ' units — set their stock to 0 or move them, then delete'); return; } setTimeout(() => app.modal({ danger: true, title: 'Delete ' + w.name + '?', body: 'It disappears from stock counts and pick lists.', confirm: 'Delete location', onConfirm: () => { app.set('warehouses', l => l.filter(x => x.id !== w.id)); app.toast(w.name + ' deleted'); } }), 30); }
      } });
      return { ...fx, pad, cards: [
        { title: 'Where your stock sits', sub: 'Stock is counted per location. New products start at your default one, and its address is on your labels.', headBtn: ro ? '' : 'Add a location', headOn: add,
          rows: own.map(w => row({ mark: w.name.slice(0, 2).toUpperCase(), name: w.name, desc: `${w.addr} · ${w.units.toLocaleString(R.locale)} units`, status: w.isDefault ? 'Default for new products' : '', stBg: 'var(--ibg,#EAF1F8)', stFg: 'var(--ifg,#00325F)', btn: ro ? '' : 'Manage',
            btnOn: () => manageW(w) })) },
        ...(app.caps.suppliersOn ? [{ title: 'Supplier locations', sub: 'Suppliers add and count these themselves. They aren’t offered as your default.', rows: theirs.length ? theirs.map(w => row({ mark: 'SU', name: w.name, desc: `${w.supplier} · ${w.units} units (their count)` })) : [row({ name: 'None yet', desc: 'They appear when a supplier adds a location.' })] }] : [])
      ] };
    }
    const rates = app.data('taxRates') || []; const inv = s.inv;
    const tg = (on, name, fn) => row({ radio: true, dot: on ? '5px solid #1D6B47' : '1.5px solid var(--faint,#9AA1AB)', name, onClick: fn });
    const invDirty = JSON.stringify(inv) !== JSON.stringify(app.data('invoiceSettings') || { perLine: true, email: true, label: R.key === 'US' ? 'Tax' : R.taxName });
    return { ...fx, pad: phone ? '0 14px 14px' : '0 28px 22px', cards: [
      { title: 'Your ' + R.taxLabel.toLowerCase().replace('rate', 'rates').replace('category', 'categories'), sub: R.key === 'US' ? 'Sales tax is worked out at checkout from the shopper’s state. You choose the category per product.' : 'Name them whatever your country calls them.', headBtn: ro || R.key === 'US' ? '' : 'Add a rate',
        headOn: () => app.modal({ title: 'Add a rate', input: { label: 'Name and percentage, e.g. “Books 7”', placeholder: 'Books 7', required: true, error: 'Type a name and a number' }, confirm: 'Add', onConfirm: v => { const m = v.match(/^(.*?)\s*([\d.]+)\s*%?$/); if (!m) { app.toast('Type a name and a percentage, e.g. “Books 7”'); return; } app.set('taxRates', l => [...l, { id: 't' + Date.now(), name: m[1].trim(), rate: m[2] + '%', isDefault: false }]); app.toast(m[1].trim() + ' added'); } }),
        rows: rates.map(t => row({ name: t.name, desc: `${app.allProducts.filter(p => p.taxClass === t.name).length} products`, status: t.rate + (t.isDefault ? ' · default for new products' : ''), stBg: t.isDefault ? 'var(--ibg,#EAF1F8)' : 'var(--sunk,#F2F0EC)', stFg: t.isDefault ? 'var(--ifg,#00325F)' : 'var(--text2,#434A55)', btn: ro || t.isDefault ? '' : 'Make default', btnOn: () => { app.set('taxRates', l => l.map(x => ({ ...x, isDefault: x.id === t.id }))); app.toast(t.name + ' is the default for new products — existing products keep theirs'); } })),
        note: 'Changing the default doesn’t touch products you’ve already priced.' },
      { title: 'On the invoice', sub: `Your ${R.taxIdLabel}: ${(app.data('storeInfo') || {}).taxId || 'not added yet — add it in Store info'}`, rows: [tg(inv.perLine, `Show ${inv.label.toLowerCase()} on each line, not just the total`, () => !ro && this.setState({ inv: { ...inv, perLine: !inv.perLine } })), tg(inv.email, 'Email the invoice with the dispatch note', () => !ro && this.setState({ inv: { ...inv, email: !inv.email } }))],
        note: 'New invoices follow new settings; issued ones are never rewritten.', save: ro ? '' : 'Save invoice settings', saveBg: invDirty ? '#EC844F' : 'var(--off,#C9CDD3)', saveOn: () => { if (!invDirty) return; app.set('invoiceSettings', inv); app.toast('Invoice settings saved — the next invoice uses them'); } }
    ] };
  }
}
</script>
</body>
</html>
