<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="padding:{{ pad }};display:grid;grid-template-columns:{{ cols }};gap:16px;align-items:start;">
  <div style="display:flex;flex-direction:column;gap:12px;">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px;"><div><div style="font-family:Manrope,sans-serif;font-weight:700;font-size:18px;">Markets</div><div style="font-size:13px;color:#5A6472;">Groups of countries you sell to, each with its own currency, language and rules.</div></div><sc-if value="{{ canEdit }}" hint-placeholder-val="{{ true }}"><button onClick="{{ a.add }}" style="height:38px;padding:0 14px;border:0;border-radius:8px;background:#EC844F;color:#FFFFFF;font-family:Manrope,sans-serif;font-weight:700;font-size:13px;cursor:pointer;">Add market</button></sc-if></div>
    <div style="background:#FFFFFF;border:1px solid #E8E2DC;border-radius:12px;overflow:hidden;">
      <sc-for list="{{ list }}" as="m" hint-placeholder-count="3">
        <button onClick="{{ m.onClick }}" style="width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px 12px {{ m.pl }};border:0;border-bottom:1px solid #EDEAE5;border-left:3px solid {{ m.bl }};background:{{ m.bg }};text-align:left;cursor:pointer;">
          <span style="flex:1;display:flex;flex-direction:column;"><strong style="font-family:Manrope,sans-serif;font-size:14px;color:#14181F;">{{ m.name }}</strong><span style="font-size:12px;color:#5A6472;">{{ m.sub }}</span></span>
          <span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;background:{{ m.tagBg }};color:{{ m.tagFg }};">{{ m.tag }}</span>
        </button>
      </sc-for>
    </div>
    <div style="background:#FFFFFF;border:1px solid #E8E2DC;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;">
      <span style="font-family:Manrope,sans-serif;font-weight:700;font-size:14px;">Everywhere else</span>
      <span style="font-size:12px;color:#5A6472;">Shoppers from a country that isn’t in any market get the settings of:</span>
      <select value="{{ backup }}" onChange="{{ on.backup }}" disabled="{{ ro }}" style="height:38px;border:1px solid #D7D3CD;border-radius:8px;background:#FFFFFF;padding:0 8px;font-size:13px;"><option value="none">Nobody — they can’t buy</option><sc-for list="{{ topOpts }}" as="o" hint-placeholder-count="2"><option value="{{ o.id }}">{{ o.name }}</option></sc-for></select>
    </div>
  </div>

  <sc-if value="{{ hasSel }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;flex-direction:column;gap:12px;">
      <div style="background:#FFFFFF;border:1px solid #E8E2DC;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;"><input value="{{ e.name }}" onChange="{{ on.name }}" readOnly="{{ ro }}" style="flex:1;min-width:160px;height:40px;border:1px solid transparent;border-radius:8px;padding:0 8px;font-family:Manrope,sans-serif;font-weight:800;font-size:20px;outline:none;background:#FDFAF7;"><button onClick="{{ a.toggleActive }}" style="display:flex;align-items:center;gap:8px;border:0;background:none;font-size:13px;cursor:pointer;color:#14181F;"><span style="width:38px;height:22px;border-radius:11px;background:{{ act.bg }};position:relative;"><span style="position:absolute;top:3px;left:{{ act.knob }};width:16px;height:16px;border-radius:50%;background:#FFFFFF;"></span></span>{{ act.label }}</button></div>
        <div style="padding:10px 12px;border-radius:8px;background:#F4F8FB;color:#00325F;font-size:13px;">{{ preview }}</div>
        <span style="font-size:13px;font-weight:600;">Countries</span>
        <div style="display:flex;flex-wrap:wrap;gap:6px;"><sc-for list="{{ countries }}" as="c" hint-placeholder-count="8"><button onClick="{{ c.onClick }}" style="height:30px;padding:0 10px;border-radius:15px;border:1px solid {{ c.bd }};background:{{ c.bg }};color:{{ c.fg }};font-size:12px;cursor:pointer;">{{ c.label }}</button></sc-for></div>
        <sc-if value="{{ notPrimary }}" hint-placeholder-val="{{ true }}"><label style="display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;">Part of a bigger market?<select value="{{ parentVal }}" onChange="{{ on.parent }}" disabled="{{ ro }}" style="height:38px;border:1px solid #D7D3CD;border-radius:8px;background:#FFFFFF;padding:0 8px;font-size:13px;font-weight:400;"><option value="">No — it stands on its own</option><sc-for list="{{ parentOpts }}" as="o" hint-placeholder-count="1"><option value="{{ o.id }}">Inside {{ o.name }} — copies its settings unless you change them here</option></sc-for></select></label></sc-if>
      </div>
      <div style="background:#FFFFFF;border:1px solid #E8E2DC;border-radius:12px;padding:18px;display:grid;grid-template-columns:{{ twoCols }};gap:12px;">
        <label style="display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;">Currency <span style="font-weight:400;font-size:12px;color:#5A6472;">{{ curNote }}</span><select value="{{ e.currency }}" onChange="{{ on.currency }}" disabled="{{ ro }}" style="height:38px;border:1px solid #D7D3CD;border-radius:8px;background:#FFFFFF;padding:0 8px;font-size:13px;font-weight:400;"><sc-for list="{{ curOpts }}" as="o" hint-placeholder-count="2"><option value="{{ o }}">{{ o }}</option></sc-for></select></label>
        <label style="display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;">Language <span style="font-weight:400;font-size:12px;color:#5A6472;">Add languages in Store info</span><select value="{{ e.language }}" onChange="{{ on.language }}" disabled="{{ ro }}" style="height:38px;border:1px solid #D7D3CD;border-radius:8px;background:#FFFFFF;padding:0 8px;font-size:13px;font-weight:400;"><sc-for list="{{ langOpts }}" as="o" hint-placeholder-count="1"><option value="{{ o.code }}">{{ o.name }}</option></sc-for></select></label>
        <label style="display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;">Price adjustment <span style="font-weight:400;font-size:12px;color:{{ adjFg }};">{{ adjNote }}</span><span style="display:flex;align-items:center;border:1px solid #D7D3CD;border-radius:8px;height:38px;padding:0 10px;background:{{ adjBg }};"><input value="{{ e.adjust }}" onChange="{{ on.adjust }}" readOnly="{{ adjRo }}" inputMode="numeric" style="flex:1;border:0;outline:none;font-size:14px;font-weight:400;background:transparent;min-width:0;"><span style="color:#5A6472;">%</span></span></label>
        <label style="display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;">Web address <span style="font-weight:400;font-size:12px;color:#5A6472;">{{ webNote }}</span><select value="{{ e.web }}" onChange="{{ on.web }}" disabled="{{ ro }}" style="height:38px;border:1px solid #D7D3CD;border-radius:8px;background:#FFFFFF;padding:0 8px;font-size:13px;font-weight:400;"><option value="main">{{ R.domain }}</option><option value="sub">{{ R.domain }}{{ e.sub }}</option><option value="own">Its own domain (Business)</option></select></label>
        <label style="display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;">Delivery charge <span style="font-weight:400;font-size:12px;color:#5A6472;">Empty = same as Settings › Shipping</span><input value="{{ e.shipRate }}" onChange="{{ on.shipRate }}" readOnly="{{ ro }}" placeholder="Same as your store" style="height:38px;border:1px solid #D7D3CD;border-radius:8px;padding:0 10px;font-size:13px;font-weight:400;outline:none;"></label>
        <label style="display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;">Tax registration <span style="font-weight:400;font-size:12px;color:#5A6472;">e.g. VAT number, OSS, sales-tax permit</span><input value="{{ e.taxReg }}" onChange="{{ on.taxReg }}" readOnly="{{ ro }}" placeholder="Optional" style="height:38px;border:1px solid #D7D3CD;border-radius:8px;padding:0 10px;font-size:13px;font-weight:400;outline:none;"></label>
      </div>
      <div style="background:#FFFFFF;border:1px solid #E8E2DC;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;">
        <span style="font-size:13px;font-weight:600;">Products sold here</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap;"><sc-for list="{{ prodModes }}" as="p" hint-placeholder-count="2"><button onClick="{{ p.onClick }}" style="height:32px;padding:0 12px;border-radius:16px;border:1px solid {{ p.bd }};background:{{ p.bg }};color:{{ p.fg }};font-size:13px;cursor:pointer;">{{ p.label }}</button></sc-for></div>
        <sc-if value="{{ someProducts }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-wrap:wrap;gap:6px;"><sc-for list="{{ prodChips }}" as="p" hint-placeholder-count="4"><button onClick="{{ p.onClick }}" style="height:28px;padding:0 10px;border-radius:14px;border:1px solid {{ p.bd }};background:{{ p.bg }};color:{{ p.fg }};font-size:12px;cursor:pointer;text-decoration:{{ p.td }};">{{ p.label }}</button></sc-for></div><span style="font-size:12px;color:#5A6472;">Crossed-out products show “Not available in your country” here.</span></sc-if>
        <span style="font-size:13px;font-weight:600;padding-top:4px;">Ways to pay here</span>
        <div style="display:flex;flex-wrap:wrap;gap:6px;"><sc-for list="{{ payChips }}" as="p" hint-placeholder-count="2"><button onClick="{{ p.onClick }}" style="height:30px;padding:0 12px;border-radius:15px;border:1px solid {{ p.bd }};background:{{ p.bg }};color:{{ p.fg }};font-size:12px;cursor:pointer;">{{ p.label }}</button></sc-for></div>
        <button onClick="{{ a.toggleDuties }}" style="display:flex;align-items:center;gap:10px;border:0;background:none;padding:4px 0;font-size:13px;cursor:pointer;text-align:left;color:#14181F;"><span style="width:38px;height:22px;border-radius:11px;background:{{ duty.bg }};position:relative;flex:none;"><span style="position:absolute;top:3px;left:{{ duty.knob }};width:16px;height:16px;border-radius:50%;background:#FFFFFF;"></span></span><span style="display:flex;flex-direction:column;"><span>Collect duties and import taxes at checkout</span><span style="font-size:12px;color:#5A6472;">Shoppers pay the full cost up front — no surprise bill at the door.</span></span></button>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:8px;">
        <sc-if value="{{ canDelete }}" hint-placeholder-val="{{ false }}"><button onClick="{{ a.del }}" style="height:40px;padding:0 14px;border:1px solid #F0D4BF;border-radius:8px;background:#FFFFFF;color:#B8541F;font-size:14px;cursor:pointer;">Delete market</button></sc-if>
        <sc-if value="{{ canEdit }}" hint-placeholder-val="{{ true }}"><button onClick="{{ a.save }}" style="height:40px;padding:0 18px;border:0;border-radius:8px;background:{{ saveBg }};color:#FFFFFF;font-family:Manrope,sans-serif;font-weight:700;font-size:14px;cursor:pointer;">Save market</button></sc-if>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  constructor(props) { super(props); const ms = props.app.data('markets') || []; this.state = { sel: ms[0] ? ms[0].id : null, e: ms[0] ? JSON.parse(JSON.stringify(ms[0])) : null }; }
  pick(m) { this.setState({ sel: m.id, e: JSON.parse(JSON.stringify(m)) }); }
  renderVals() {
    const app = this.props.app; if (!app) return {};
    const { R, caps: c, phone } = app; const s = this.state;
    const ms = app.data('markets') || []; const e = s.e;
    const canEdit = c.isOwner && !c.readOnly; const ro = !canEdit;
    const growth = c.P.adjust; const bizDomain = c.P.marketDomain;
    const NAMES = { US: 'United States', CA: 'Canada', GB: 'United Kingdom', DE: 'Germany', FR: 'France', NL: 'Netherlands', AT: 'Austria', IT: 'Italy', ES: 'Spain', IN: 'India', AE: 'UAE', AU: 'Australia', JP: 'Japan' };
    const setE = patch => this.setState({ e: { ...s.e, ...patch } });
    const order = []; ms.filter(m => !m.parentId).forEach(p => { order.push([p, 0]); ms.filter(k => k.parentId === p.id).forEach(k => order.push([k, 1])); });
    const list = order.map(([m, d]) => ({ name: m.name, sub: m.countries.map(k => NAMES[k] || k).join(', ') + ' · ' + m.currency, pl: d ? '32px' : '14px', tag: m.primary ? 'Primary' : !m.active ? 'Off' : d ? 'Sub-market' : 'Active', tagBg: m.primary ? '#EAF1F8' : m.active ? '#EEF7F2' : '#F2F0EC', tagFg: m.primary ? '#00325F' : m.active ? '#1D6B47' : '#5A6472', bl: m.id === s.sel ? '#00519F' : 'transparent', bg: m.id === s.sel ? '#F4F8FB' : '#FFFFFF', onClick: () => this.pick(m) }));
    const base = { pad: phone ? '14px' : '22px 28px', cols: phone ? '1fr' : 'minmax(0,1fr) minmax(0,1.6fr)', R, canEdit, ro, list, backup: app.data('backupMarket') || 'none', topOpts: ms.filter(m => !m.parentId).map(m => ({ id: m.id, name: m.name })),
      on: { backup: ev => { app.set('backupMarket', ev.target.value); app.toast('Saved'); } },
      a: { add: () => app.within('markets', ms.length, 'Markets') && app.modal({ title: 'New market', body: 'Name it after the place, e.g. “UK” or “Nordics”. You’ll pick countries next.', input: { label: 'Market name', placeholder: 'e.g. United Kingdom', required: true, error: 'Give it a name' }, confirm: 'Create', onConfirm: name => { const m = { id: 'm' + Date.now(), name: name.trim(), countries: [], parentId: null, currency: R.cur, language: 'en', adjust: 0, web: 'sub', sub: '/' + name.trim().slice(0, 2).toLowerCase(), domain: '', products: 'all', excluded: [], shipRate: '', payments: (app.data('gateways') || []).filter(g => g.status === 'live').map(g => g.key), duties: false, taxReg: '', active: true }; app.set('markets', l => [...l, m]); this.pick(m); app.toast('Market created — pick its countries'); } }) } };
    if (!e) return { ...base, hasSel: false };
    const parent = ms.find(m => m.id === e.parentId);
    const taken = new Set(ms.filter(m => m.id !== e.id && m.parentId !== e.id && e.parentId !== m.id).flatMap(m => m.countries));
    const curs = (app.data('currencies') || []).map(x => x.code);
    const langs = app.data('languages') || [];
    const cur = (app.data('currencies') || []).find(x => x.code === e.currency) || {};
    const gws = (app.data('gateways') || []).filter(g => g.status === 'live');
    const dirty = JSON.stringify(e) !== JSON.stringify(ms.find(m => m.id === e.id));
    const langName = (langs.find(l => l.code === e.language) || { name: 'English' }).name;
    const excludedN = e.products === 'some' ? e.excluded.length : 0;
    return { ...base, hasSel: true, e, notPrimary: !e.primary, canDelete: canEdit && !e.primary, saveBg: dirty ? '#EC844F' : '#C9CDD3', twoCols: phone ? '1fr' : 'repeat(2,minmax(0,1fr))',
      act: { bg: e.active ? '#1D6B47' : '#C9CDD3', knob: e.active ? '19px' : '3px', label: e.active ? 'Selling here' : 'Not selling here' },
      preview: e.countries.length ? `A shopper in ${NAMES[e.countries[0]] || e.countries[0]} sees ${e.currency}${cur.main ? '' : cur.auto ? ' (converted)' : ' (your own prices)'}, ${langName}, ${e.web === 'main' ? R.domain : e.web === 'sub' ? R.domain + e.sub : 'its own domain'}${Number(e.adjust) ? `, prices ${Number(e.adjust) > 0 ? '+' : ''}${e.adjust}%` : ''}${excludedN ? `, ${excludedN} products not sold` : ''}${e.duties ? ', duties paid at checkout' : ''}.` : 'Pick at least one country.',
      countries: Object.keys(NAMES).map(k => { const on = e.countries.includes(k); const busy = taken.has(k) && !on; return { label: (on ? '✓ ' : '') + NAMES[k] + (busy ? ' · in another market' : ''), bd: on ? '#00519F' : '#D7D3CD', bg: on ? '#EAF1F8' : busy ? '#FDFAF7' : '#FFFFFF', fg: on ? '#00325F' : busy ? '#9AA1AB' : '#434A55', onClick: () => { if (ro) return; if (busy) { app.toast(NAMES[k] + ' is already in another market — a country can only be in one'); return; } setE({ countries: on ? e.countries.filter(x => x !== k) : [...e.countries, k] }); } }; }),
      parentVal: e.parentId || '', parentOpts: ms.filter(m => m.id !== e.id && !m.parentId).map(m => ({ id: m.id, name: m.name })),
      curOpts: curs, curNote: cur.main ? 'Your main currency' : cur.auto ? 'Converted automatically · set in Store info' : 'You type prices for this one · set in Store info',
      langOpts: langs.map(l => ({ code: l.code, name: l.name })),
      adjRo: ro || !growth, adjBg: growth ? '#FFFFFF' : '#FDFAF7', adjNote: growth ? (c.P.fixed ? 'e.g. +10. Fixed prices per product: set on each product for this market.' : 'e.g. +10 to cover higher costs abroad. Fixed prices per market are on Business.') : 'On Growth · See plans', adjFg: growth ? '#5A6472' : '#00519F',
      webNote: !bizDomain ? 'Own domain per market is on Business' : 'Where shoppers in this market land',
      prodModes: [['all', 'All products'], ['some', 'All except some']].map(([k, l]) => ({ label: l, bd: e.products === k ? '#00519F' : '#D7D3CD', bg: e.products === k ? '#EAF1F8' : '#FFFFFF', fg: e.products === k ? '#00325F' : '#434A55', onClick: () => !ro && setE({ products: k }) })),
      someProducts: e.products === 'some', prodChips: app.allProducts.map(p => { const off = e.excluded.includes(p.id); return { label: p.name, bd: off ? '#F0D4BF' : '#D7D3CD', bg: off ? '#FDF0E8' : '#FFFFFF', fg: off ? '#B8541F' : '#434A55', td: off ? 'line-through' : 'none', onClick: () => !ro && setE({ excluded: off ? e.excluded.filter(x => x !== p.id) : [...e.excluded, p.id] }) }; }),
      payChips: gws.map(g => { const on = e.payments.includes(g.key); return { label: (on ? '✓ ' : '') + g.name, bd: on ? '#00519F' : '#D7D3CD', bg: on ? '#EAF1F8' : '#FFFFFF', fg: on ? '#00325F' : '#434A55', onClick: () => { if (ro) return; if (on && e.payments.length === 1) { app.toast('Keep at least one way to pay in each market'); return; } setE({ payments: on ? e.payments.filter(x => x !== g.key) : [...e.payments, g.key] }); } }; }),
      duty: { bg: e.duties ? '#1D6B47' : '#C9CDD3', knob: e.duties ? '19px' : '3px' },
      on: { ...base.on, name: ev => setE({ name: ev.target.value }), currency: ev => setE({ currency: ev.target.value }), language: ev => setE({ language: ev.target.value }), adjust: ev => setE({ adjust: ev.target.value.replace(/[^\d-]/g, '') }), shipRate: ev => setE({ shipRate: ev.target.value }), taxReg: ev => setE({ taxReg: ev.target.value }),
        web: ev => { if (ev.target.value === 'own' && !bizDomain) { app.upgrade('An own domain per market', 'business'); return; } setE({ web: ev.target.value }); },
        parent: ev => { const p = ms.find(m => m.id === ev.target.value); setE(p ? { parentId: p.id, currency: p.currency, language: p.language, payments: [...p.payments], duties: p.duties } : { parentId: null }); if (p) app.toast(`Copied ${p.name}’s settings — change any of them for ${e.name}`); } },
      a: { ...base.a, toggleActive: () => { if (ro) return; if (e.primary) { app.toast('Your primary market can’t be switched off'); return; } setE({ active: !e.active }); }, toggleDuties: () => { if (ro) return; if (!e.duties && !app.allow('duties', 'Duties & import taxes at checkout')) return; setE({ duties: !e.duties }); },
        save: () => { if (!dirty) return; if (!e.countries.length) { app.toast('Pick at least one country'); return; } if (!e.name.trim()) { app.toast('Give the market a name'); return; } app.set('markets', l => l.map(m => m.id === e.id ? e : (m.parentId === e.id ? { ...m } : m))); app.toast(`${e.name} saved — shoppers there see it within a minute`); },
        del: () => app.modal({ danger: true, title: `Delete ${e.name}?`, body: `Shoppers in ${e.countries.map(k => NAMES[k]).join(', ') || 'these countries'} get your “Everywhere else” settings instead. Orders already placed aren’t affected.`, confirm: 'Delete market', onConfirm: () => { app.set('markets', l => l.filter(m => m.id !== e.id).map(m => m.parentId === e.id ? { ...m, parentId: null } : m)); const first = ms.find(m => m.id !== e.id); if (first) this.pick(first); app.toast(e.name + ' deleted'); } }) } };
  }
}
</script>
</body>
</html>
