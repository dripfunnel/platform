<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="padding:{{ pad }};display:flex;flex-direction:column;gap:14px;max-width:1000px;">
  <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;">
    <div><div style="font-family:Manrope,sans-serif;font-weight:700;font-size:18px;">{{ title }}</div><div style="font-size:13px;color:var(--muted,#5A6472);">{{ sub }}</div></div>
    <sc-if value="{{ canEdit }}" hint-placeholder-val="{{ true }}"><button onClick="{{ a.invite }}" style="height:40px;padding:0 16px;border:0;border-radius:8px;background:#EC844F;color:#FFFFFF;font-family:Manrope,sans-serif;font-weight:700;font-size:14px;cursor:pointer;">{{ inviteLabel }}</button></sc-if>
  </div>
  <sc-if value="{{ isSupplier }}" hint-placeholder-val="{{ false }}">
    <button onClick="{{ a.approval }}" style="display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card,#FFFFFF);border:1px solid var(--border,#E8E2DC);border-radius:12px;text-align:left;cursor:pointer;">
      <span style="width:42px;height:24px;border-radius:12px;background:{{ appr.bg }};position:relative;flex:none;"><span style="position:absolute;top:4px;left:{{ appr.knob }};width:16px;height:16px;border-radius:50%;background:var(--card,#FFFFFF);"></span></span>
      <span style="display:flex;flex-direction:column;"><strong style="font-family:Manrope,sans-serif;font-size:14px;color:var(--text,#14181F);">Approve supplier products before they go live</strong><span style="font-size:13px;color:var(--muted,#5A6472);">{{ appr.sub }}</span></span>
    </button>
  </sc-if>
  <div style="display:flex;gap:6px;flex-wrap:wrap;"><sc-for list="{{ chips }}" as="f" hint-placeholder-count="4"><button onClick="{{ f.onClick }}" style="height:32px;padding:0 12px;border-radius:16px;border:1px solid {{ f.bd }};background:{{ f.bg }};color:{{ f.fg }};font-family:Manrope,sans-serif;font-weight:600;font-size:13px;cursor:pointer;">{{ f.label }}</button></sc-for></div>
  <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}"><div style="background:var(--card,#FFFFFF);border:1px solid var(--border,#E8E2DC);border-radius:12px;padding:32px;text-align:center;font-size:14px;color:var(--muted,#5A6472);">{{ emptyText }}</div></sc-if>
  <div style="background:var(--card,#FFFFFF);border:1px solid var(--border,#E8E2DC);border-radius:12px;overflow:hidden;">
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
      <div style="display:grid;grid-template-columns:{{ cols }};gap:12px;padding:12px 16px;border-bottom:1px solid var(--border,#EDEAE5);align-items:center;font-size:13px;">
        <span style="display:flex;align-items:center;gap:10px;min-width:0;"><span style="width:34px;height:34px;border-radius:{{ r.radius }};background:{{ r.avBg }};color:{{ r.avFg }};display:flex;align-items:center;justify-content:center;font-family:Manrope,sans-serif;font-weight:700;font-size:12px;flex:none;">{{ r.init }}</span><span style="display:flex;flex-direction:column;min-width:0;"><strong style="font-family:Manrope,sans-serif;color:var(--text,#14181F);">{{ r.name }}</strong><span style="color:var(--muted,#5A6472);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ r.sub }}</span></span></span>
        <span style="color:var(--text2,#434A55);">{{ r.role }}</span>
        <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}"><span style="color:{{ r.stFg }};">{{ r.status }}</span></sc-if>
        <sc-if value="{{ canEdit }}" hint-placeholder-val="{{ true }}"><button onClick="{{ r.menu }}" style="width:32px;height:32px;border:1px solid var(--border,#E8E2DC);border-radius:6px;background:var(--card,#FFFFFF);cursor:pointer;">⋯</button></sc-if>
      </div>
    </sc-for>
  </div>
  <span style="font-size:12px;color:var(--muted,#5A6472);">{{ foot }}</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { filter: 'all' };
  renderVals() {
    const app = this.props.app; if (!app) return {};
    const { caps: c, phone } = app; const s = this.state; const mode = this.props.mode || 'people';
    const canEdit = c.isOwner && !c.readOnly;
    const base = { pad: phone ? '14px' : '22px 28px', canEdit, wide: !phone, cols: phone ? 'minmax(0,1fr) 90px' + (canEdit ? ' 32px' : '') : 'minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr)' + (canEdit ? ' 32px' : '') };
    if (mode === 'people') {
      const ppl = app.data('people') || [];
      const setP = fn => app.set('people', fn);
      const owners = ppl.filter(p => p.role === 'Owner' && p.status === 'active').length;
      const T = { all: () => true, staff: p => ['Owner', 'Manager', 'Staff'].includes(p.role), sup: p => p.role === 'Supplier user', wait: p => p.status === 'invited' };
      const staffCount = ppl.filter(p => p.id !== 'u1' && p.role !== 'Supplier user').length;
      const inviteReal = () => { if (!app.within('staff', staffCount, 'Staff accounts')) return; app.modal({ title: 'Invite someone', body: 'They get an email to join this store. If they already have an account, they simply join.', input: { label: 'Their email', placeholder: 'name@example.com', required: true, error: 'Type an email address' }, confirm: 'Next: choose a role',
        onConfirm: email => { if (!/.+@.+\..+/.test(email)) { app.toast('That doesn’t look like an email address'); return; } setTimeout(() => app.modal({ title: 'What can ' + email + ' do?', choices: [{ label: 'Staff', sub: 'Orders, customers, view products', value: 'Staff' }, { label: 'Manager', sub: 'Everything except Settings and Billing', value: 'Manager' }, { label: 'Owner', sub: 'Everything, including Billing', value: 'Owner' }], confirm: 'Send invite', onConfirm: role => { if (role === 'Manager' && !app.allow('manager', 'The Manager role')) return; setP(l => [...l, { id: 'u' + Date.now(), name: '', email: email.trim(), role, status: 'invited', note: 'invited just now' }]); app.toast('Invite sent to ' + email.trim()); } }), 30); } }); };
      const list = ppl.filter(T[s.filter]);
      return { ...base, title: 'Everyone in this store', sub: `${ppl.filter(p => p.status === 'active').length} active · ${ppl.filter(p => p.status === 'invited').length} waiting to accept. Removing someone removes them from this store, not their account.`, inviteLabel: 'Invite someone', isSupplier: false,
        chips: [['all', 'Everyone'], ['staff', 'Staff'], ['sup', 'Supplier users'], ['wait', 'Waiting']].filter(([k]) => k !== 'sup' || app.caps.suppliersOn).map(([k, l]) => ({ label: `${l} · ${ppl.filter(T[k]).length}`, bd: s.filter === k ? 'var(--focus,#00519F)' : 'var(--field,#D7D3CD)', bg: s.filter === k ? 'var(--ibg,#EAF1F8)' : 'var(--card,#FFFFFF)', fg: s.filter === k ? 'var(--ifg,#00325F)' : 'var(--text2,#434A55)', onClick: () => this.setState({ filter: k }) })),
        empty: !list.length, emptyText: 'Nobody here yet.', foot: app.caps.suppliersOn ? 'Supplier users carry a squared mark. What their company can do is set in the Supplier tab. Role changes can take a few minutes to apply.' : 'Role changes can take a few minutes to apply.',
        rows: list.map(p => ({ init: p.name ? p.name.split(' ').map(w => w[0]).join('') : '?', name: p.name || p.email, sub: p.company ? p.company + ' · supplier' : p.email + (p.note ? ' · ' + p.note : ''), role: p.role, status: app.paused.staff.has(p.id) ? 'Paused — over your plan' : p.status === 'invited' ? 'Waiting' : 'Active', stFg: app.paused.staff.has(p.id) ? 'var(--pfg,#8F4017)' : p.status === 'invited' ? 'var(--wfg,#7A4B00)' : 'var(--okfg,#1D6B47)',
          radius: p.company ? '4px' : '50%', avBg: p.company ? '#5A6472' : 'var(--ibg,#EAF1F8)', avFg: p.company ? '#FFFFFF' : 'var(--ifg,#00325F)',
          menu: () => {
            const opts = p.status === 'invited' ? [{ label: 'Resend invite', sub: p.sentAt ? 'Last sent ' + p.note.replace('invited ', '') : 'The link in the old email stops working', value: 'resend' }, { label: 'Cancel invite', value: 'cancel' }] : p.company ? [{ label: 'Remove this person', sub: 'Others at ' + p.company + ' keep their access', value: 'remove' }] : [{ label: 'Change role', value: 'role' }, { label: 'Remove from this store', value: 'remove' }];
            if (p.company && p.status !== 'invited') opts.unshift({ label: 'What they can do', sub: 'Set for everyone at ' + p.company + ' in the Supplier tab', value: 'info' });
            app.modal({ title: p.name || p.email, choices: opts, confirm: 'Continue', onConfirm: v => {
              if (v === 'info') { app.toast('Open the Supplier tab to change what ' + p.company + ' can do'); return; }
              if (v === 'resend') { setP(l => l.map(x => x.id === p.id ? { ...x, note: 'invited just now', sentAt: Date.now() } : x)); app.toast('New invite sent to ' + p.email + ' — the old link no longer works'); }
              if (v === 'cancel') { setP(l => l.filter(x => x.id !== p.id)); app.toast('Invite cancelled'); }
              if (v === 'role') setTimeout(() => app.modal({ title: 'Role for ' + p.name, choices: ['Owner', 'Manager', 'Staff'].map(r => ({ label: r, value: r })), confirm: 'Change role', onConfirm: r => { if (p.role === 'Owner' && r !== 'Owner' && owners <= 1) { app.toast('The last owner can’t be demoted — make someone else an owner first'); return; } setP(l => l.map(x => x.id === p.id ? { ...x, role: r } : x)); app.toast(`${p.name} is now ${r} — it can take a few minutes to apply`); } }), 30);
              if (v === 'remove') { if (p.role === 'Owner' && owners <= 1) { app.toast('The last owner can’t be removed'); return; } setTimeout(() => app.modal({ danger: true, title: `Remove ${p.name || p.email}?`, body: 'They lose access to this store straight away. Their account and other stores aren’t touched.', confirm: 'Remove', onConfirm: () => { setP(l => l.filter(x => x.id !== p.id)); if (p.company) app.set('suppliers', l => l.map(y => y.name === p.company ? { ...y, users: Math.max(0, y.users - 1) } : y)); app.toast((p.name || p.email) + ' removed from this store'); } }), 30); }
            } });
          } })),
        a: { invite: inviteReal } };
    }
    const sup = app.data('suppliers') || [];
    const setS = fn => app.set('suppliers', fn);
    const ACC = { stock: ['Stock only', 'They update quantities. Nothing else.'], products: ['Products and stock', 'They add and edit their own products. The usual choice.'], orders: ['Products, stock and their orders', 'They also see and pack the orders with their items.'] };
    const count = n => app.allProducts.filter(p => p.supplier === n).length;
    const T = { all: () => true, active: x => x.status === 'active' || x.status === 'invited', suspended: x => x.status === 'suspended' };
    const list = sup.filter(T[s.filter] || T.all);
    return { ...base, title: 'Your suppliers', sub: `${sup.length} companies, ${app.allProducts.filter(p => p.supplier !== 'You').length} of your ${app.allProducts.length} products. Their products sell under your store’s name.`, inviteLabel: 'Invite a supplier', isSupplier: true,
      appr: { bg: app.caps.approvalOn ? '#1D6B47' : 'var(--off,#C9CDD3)', knob: app.caps.approvalOn ? '22px' : '4px', sub: app.caps.approvalOn ? 'On — new supplier products, and changes to price, title or photos, wait for your approval in Products. Other edits go live straight away.' : 'Off — supplier products go live when they save them.' },
      chips: [['all', 'All'], ['active', 'Active'], ['suspended', 'Suspended']].map(([k, l]) => ({ label: `${l} · ${sup.filter(T[k]).length}`, bd: s.filter === k ? 'var(--focus,#00519F)' : 'var(--field,#D7D3CD)', bg: s.filter === k ? 'var(--ibg,#EAF1F8)' : 'var(--card,#FFFFFF)', fg: s.filter === k ? 'var(--ifg,#00325F)' : 'var(--text2,#434A55)', onClick: () => this.setState({ filter: k }) })),
      empty: !list.length, emptyText: 'No suppliers yet. Invite a company whose products you want to sell under your name.', foot: 'Access is set on the company — everyone there can do the same things. Changes take a few minutes.',
      rows: list.map(x => ({ init: x.name.split(' ').map(w => w[0]).join('').slice(0, 2), name: x.name, sub: `${x.users} ${x.users === 1 ? 'user' : 'users'} · ${count(x.name)} products`, role: ACC[x.access][0], status: x.status === 'active' ? 'Active' : x.status === 'invited' ? 'Invite sent' : 'Suspended', stFg: x.status === 'active' ? 'var(--okfg,#1D6B47)' : x.status === 'invited' ? 'var(--wfg,#7A4B00)' : 'var(--link,#B8541F)', radius: '4px', avBg: '#5A6472', avFg: '#FFFFFF',
        menu: () => app.modal({ title: x.name, choices: [{ label: 'Add a person', sub: 'Another login for ' + x.name, value: 'add' }, { label: 'Change what they can do', value: 'access' }, { label: x.status === 'active' ? 'Suspend' : 'Reactivate', value: 'susp' }, { label: 'Remove supplier', value: 'remove' }], confirm: 'Continue', onConfirm: v => {
          if (v === 'add') setTimeout(() => app.modal({ title: 'Add a person at ' + x.name, body: 'They can do the same as everyone else at ' + x.name + '.', input: { label: 'Their email', placeholder: 'name@' + app.slug(x.name).split('-')[0] + '.com', required: true, error: 'Type an email address' }, confirm: 'Send invite', onConfirm: em => { if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em.trim())) { app.toast('That doesn’t look like an email address'); return; } app.set('people', l => [...l, { id: 'u' + Date.now(), name: '', email: em.trim(), role: 'Supplier user', company: x.name, status: 'invited', note: 'invited just now' }]); setS(l => l.map(y => y.id === x.id ? { ...y, users: y.users + 1 } : y)); app.toast('Invite sent to ' + em.trim()); } }), 30);
          if (v === 'access') setTimeout(() => app.modal({ title: 'What can ' + x.name + ' do?', choices: Object.entries(ACC).map(([k, [l, d]]) => ({ label: l, sub: d, value: k })), confirm: 'Save', onConfirm: k => { setS(l => l.map(y => y.id === x.id ? { ...y, access: k } : y)); app.toast(`${x.name}: ${ACC[k][0]} — takes a few minutes to apply`); } }), 30);
          if (v === 'susp') { if (x.status === 'active') setTimeout(() => app.modal({ title: `Suspend ${x.name}?`, body: `They can’t sign in to your store. Their ${count(x.name)} products are still in your catalogue.`, choices: [{ label: 'Hide their products too', value: 'hide' }, { label: 'Keep selling their products', value: 'keep' }], confirm: 'Suspend', onConfirm: k => { setS(l => l.map(y => y.id === x.id ? { ...y, status: 'suspended' } : y)); if (k === 'hide') app.updateProducts(app.allProducts.filter(p => p.supplier === x.name).map(p => p.id), { status: 'hidden' }); app.toast(x.name + ' suspended' + (k === 'hide' ? ' and their products hidden' : '')); } }), 30); else { setS(l => l.map(y => y.id === x.id ? { ...y, status: 'active' } : y)); app.toast(x.name + ' reactivated'); } }
          if (v === 'remove') setTimeout(() => app.modal({ danger: true, title: `Remove ${x.name}?`, body: `Their users lose access straight away. Their ${count(x.name)} products are hidden from shoppers and still marked as theirs — show any you want to keep selling, or delete them.`, confirm: 'Remove supplier', onConfirm: () => { const n = app.removeSupplier(x.id); app.toast(x.name + ' removed — ' + n + ' products hidden from shoppers', 'See them', () => app.go('products', { productFilter: 'hidden' })); } }), 30);
        } }) })),
      a: { invite: () => app.allow('suppliers', 'Suppliers') && app.modal({ tag: 'Step 1 of 3', title: 'Invite a supplier', body: 'This creates their company and first user in one go.', input: { label: 'Company name', placeholder: 'Their business name', required: true, error: 'Type their company name' }, confirm: 'Next', onConfirm: name => { if (sup.some(y => y.name.toLowerCase() === name.trim().toLowerCase())) { app.toast(name.trim() + ' is already one of your suppliers'); return; } setTimeout(() => app.modal({ tag: 'Step 2 of 3', title: 'Who at ' + name.trim() + ' gets the invite?', body: 'They become the first user. They can’t add their own colleagues — you add more from the company’s row.', input: { label: 'Their email', placeholder: 'name@company.com', required: true, error: 'Type an email address' }, confirm: 'Next', onConfirm: em => { if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em.trim())) { app.toast('That doesn’t look like an email address'); return; } setTimeout(() => app.modal({ tag: 'Step 3 of 3', title: 'What can ' + name.trim() + ' do?', body: 'You can change this later from their row. They never see your customers’ names, emails or addresses.', choices: Object.entries(ACC).map(([k, [l, d]]) => ({ label: l, sub: d, value: k })), confirm: 'Send the invite', onConfirm: k => { setS(l => [...l, { id: 's' + Date.now(), name: name.trim(), users: 1, access: k, status: 'invited' }]); app.set('people', l => [...l, { id: 'u' + Date.now(), name: '', email: em.trim(), role: 'Supplier user', company: name.trim(), status: 'invited', note: 'invited just now' }]); app.toast('Invite sent to ' + em.trim() + ' at ' + name.trim()); } }), 30); } }), 30); } }),
        approval: () => { if (!canEdit) return; if (!app.allow('suppliers', 'Supplier approval')) return; app.set('approvalOn', !app.caps.approvalOn); app.toast(app.caps.approvalOn ? 'Approval off — live products stay live' : 'Approval on — live products stay live; only new and edited ones wait'); } } };
  }
}
</script>
</body>
</html>
