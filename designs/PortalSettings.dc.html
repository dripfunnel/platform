<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;">
  <div style="background:var(--card,#FFFFFF);border-bottom:1px solid var(--border,#E8E2DC);display:flex;gap:20px;padding:0 {{ padX }};overflow:auto;">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="9"><button onClick="{{ t.onClick }}" style="height:48px;border:0;border-bottom:3px solid {{ t.bd }};background:none;font-family:Manrope,sans-serif;font-weight:{{ t.fw }};font-size:14px;color:{{ t.fg }};cursor:pointer;white-space:nowrap;padding:0 2px;display:flex;align-items:center;gap:6px;">{{ t.label }}<sc-if value="{{ t.count }}" hint-placeholder-val="{{ false }}"><span style="font-size:11px;font-weight:600;padding:1px 6px;border-radius:8px;background:{{ t.cBg }};color:{{ t.cFg }};">{{ t.count }}</span></sc-if></button></sc-for>
  </div>
  <sc-if value="{{ is.store }}" hint-placeholder-val="{{ true }}"><dc-import name="SetStore" app="{{ app }}" hint-size="100%,700px"></dc-import></sc-if>
  <sc-if value="{{ is.people }}" hint-placeholder-val="{{ false }}"><dc-import name="SetTeam" app="{{ app }}" mode="people" hint-size="100%,600px"></dc-import></sc-if>
  <sc-if value="{{ is.supplier }}" hint-placeholder-val="{{ false }}"><dc-import name="SetTeam" app="{{ app }}" mode="supplier" hint-size="100%,600px"></dc-import></sc-if>
  <sc-if value="{{ is.payments }}" hint-placeholder-val="{{ false }}"><dc-import name="SetOps" app="{{ app }}" mode="payments" hint-size="100%,600px"></dc-import></sc-if>
  <sc-if value="{{ is.shipping }}" hint-placeholder-val="{{ false }}"><dc-import name="SetOps" app="{{ app }}" mode="shipping" hint-size="100%,600px"></dc-import></sc-if>
  <sc-if value="{{ is.warehouse }}" hint-placeholder-val="{{ false }}"><dc-import name="SetOps" app="{{ app }}" mode="warehouse" hint-size="100%,600px"></dc-import></sc-if>
  <sc-if value="{{ is.tax }}" hint-placeholder-val="{{ false }}"><dc-import name="CatSettings" app="{{ app }}" tab="tax" hint-size="100%,400px"></dc-import><dc-import name="SetOps" app="{{ app }}" mode="tax" hint-size="100%,400px"></dc-import></sc-if>
  <sc-if value="{{ is.markets }}" hint-placeholder-val="{{ false }}"><dc-import name="SetMarkets" app="{{ app }}" hint-size="100%,700px"></dc-import></sc-if>
  <sc-if value="{{ is.catalogue }}" hint-placeholder-val="{{ false }}"><dc-import name="CatSettings" app="{{ app }}" tab="catalogue" hint-size="100%,700px"></dc-import></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: (props.app && props.app.settingsTab) || 'store' }; }
  renderVals() {
    const app = this.props.app; if (!app) return {};
    const s = this.state;
    const ppl = app.data('people') || []; const sup = app.data('suppliers') || []; const cs = (app.data('shipping') || { couriers: [] }).couriers;
    const defs = [['store', 'Store info'], ['people', 'People', String(ppl.length)], ['supplier', 'Supplier', String(sup.length)], ['payments', 'Payment setup'], ['shipping', 'Shipping', cs.some(x => x.status === 'failed') ? '!' : ''], ['warehouse', 'Warehouse', String((app.data('warehouses') || []).length)], ['tax', 'Tax setup'], ['markets', 'Markets', String((app.data('markets') || []).length)], ['catalogue', 'Catalogue']].filter(([k]) => k !== 'supplier' || app.caps.suppliersOn);
    const is = {}; defs.forEach(([k]) => { is[k] = s.tab === k; });
    return { app, is, padX: app.phone ? '14px' : '28px',
      tabs: defs.map(([k, l, n]) => ({ label: l, count: n || '', cBg: n === '!' ? 'var(--pbg,#FDF0E8)' : 'var(--sunk,#F2F0EC)', cFg: n === '!' ? 'var(--link,#B8541F)' : 'var(--muted,#5A6472)', bd: s.tab === k ? '#EC844F' : 'transparent', fg: s.tab === k ? 'var(--text,#14181F)' : 'var(--muted,#5A6472)', fw: s.tab === k ? 700 : 500, onClick: () => this.setState({ tab: k }) })) };
  }
}
</script>
</body>
</html>
