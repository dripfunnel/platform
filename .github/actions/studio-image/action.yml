name: Pin the studio image
description: >
  Writes a digest-pinned storefront-build image into this checkout's wrangler.jsonc, in place of the
  committed placeholder (#790, #816). Nothing is committed. Needs CLOUDFLARE_API_TOKEN and
  CLOUDFLARE_ACCOUNT_ID in the caller's env.
inputs:
  channel:
    required: true
    description: "stable (newest x.y.z tag, prod) or dev (newest <version>-dev.<run> tag, dev)"
  digest:
    required: false
    default: ''
    description: A sha256 digest to use instead of looking up the newest tag
  directory:
    required: false
    default: apps/api
    description: The Worker's folder, relative to the repo root
outputs:
  digest:
    value: ${{ steps.pin.outputs.digest }}
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      working-directory: ${{ inputs.directory }}
      env:
        INPUT_CHANNEL: ${{ inputs.channel }}
        INPUT_DIGEST: ${{ inputs.digest }}
      run: |
        set -euo pipefail
        case "$INPUT_CHANNEL" in
          stable)
            placeholder=PROD_STUDIO_IMAGE
            filter='[.[] | select(.name == "storefront-build") | .tags[] | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(split(".") | map(tonumber)) | last // empty'
            none="No stable storefront-build tag in the prod registry: run release.yml first." ;;
          dev)
            placeholder=DEV_STUDIO_IMAGE
            filter='[.[] | select(.name == "storefront-build") | .tags[] | select(test("-dev\\.[0-9]+$"))] | sort_by(split(".")[-1] | tonumber) | last // empty'
            none="No storefront-build dev tag in the dev registry: run the release workflow on dev first." ;;
          *) echo "channel must be stable or dev, got: $INPUT_CHANNEL" >&2; exit 1 ;;
        esac
        if [ -n "$INPUT_DIGEST" ]; then
          digest=$INPUT_DIGEST
          tag="(given)"
        else
          tag=$(pnpm exec wrangler containers images list --json | jq -r "$filter")
          [ -n "$tag" ] || { echo "$none" >&2; exit 1; }
          password=$(pnpm exec wrangler containers registries credentials registry.cloudflare.com --pull --expiration-minutes 5 | tail -n 1)
          echo "::add-mask::$password"
          digest=$(curl -sSfI -u "v1:$password" -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://registry.cloudflare.com/v2/$CLOUDFLARE_ACCOUNT_ID/storefront-build/manifests/$tag" | tr -d '\r' | awk 'tolower($1) == "docker-content-digest:" { print $2 }')
        fi
        [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "No valid digest for storefront-build:$tag." >&2; exit 1; }
        sed -i "s|$placeholder|registry.cloudflare.com/$CLOUDFLARE_ACCOUNT_ID/storefront-build@$digest|" wrangler.jsonc
        echo "digest=$digest" >> "$GITHUB_OUTPUT"
        echo "Studio image: storefront-build:$tag @ $digest"
        echo "- Studio image digest: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
