name: Deploy Pages project
description: Deploy an already-built SPA to a Cloudflare Pages branch

inputs:
  project-name:
    required: true
  dist:
    required: true
    description: Path to the built assets, relative to apps/api (e.g. ../ui/store/dist)
  branch:
    required: true
    description: Pages branch deploy name
  commit-hash:
    required: true

runs:
  using: composite
  steps:
    # Ask before creating, rather than creating and ignoring the failure.
    #
    # This used to be `create … || echo "already exists, continuing."`, which swallowed every
    # failure and not just the expected one: a bad token, a wrong account id, a rate limit or
    # a network blip all printed "already exists, continuing" and the run carried on to the
    # deploy, which then failed with something less obvious. It also printed a red API error
    # on every single deploy of a project that had existed for weeks, which teaches people to
    # read past red in this workflow.
    #
    # Nothing is swallowed blanket-style: only the one error code that means "it exists".
    - run: |
        set -euo pipefail
        # `.. | objects` rather than `.[]`, so a change in how wrangler wraps its JSON makes
        # this miss the project rather than crash — and the fallback below then covers it.
        if pnpm exec wrangler pages project list --json \
          | jq -e --arg name "$INPUT_PROJECT_NAME" \
               '[.. | objects | select(.name? == $name)] | length > 0' > /dev/null; then
          echo "Pages project \"$INPUT_PROJECT_NAME\" already exists."
        else
          echo "Pages project \"$INPUT_PROJECT_NAME\" not found; creating it."
          # Error 8000002 is "a project with this name already exists". Only that one is
          # benign — it means the check above missed it, or two runs raced. Anything else
          # (a bad token, the wrong account, a rate limit) must fail the step, which is what
          # the old blanket `|| echo "already exists, continuing."` hid.
          # Captured to a file rather than a process substitution: with `tee` the grep can
          # run before the write is flushed, and this decides whether the deploy fails.
          if ! pnpm exec wrangler pages project create "$INPUT_PROJECT_NAME" \
                 --production-branch main 2> "$RUNNER_TEMP/pages-create.err"; then
            cat "$RUNNER_TEMP/pages-create.err" >&2
            if grep -q '8000002' "$RUNNER_TEMP/pages-create.err"; then
              echo "Project already existed after all; continuing."
            else
              echo "Creating the Pages project failed for a reason other than it existing." >&2
              exit 1
            fi
          fi
        fi
      shell: bash
      working-directory: apps/api
      env:
        INPUT_PROJECT_NAME: ${{ inputs.project-name }}
    - run: |
        set -euo pipefail
        pnpm exec wrangler pages deploy "$INPUT_DIST" \
          --project-name "$INPUT_PROJECT_NAME" \
          --branch "$INPUT_BRANCH" \
          --commit-hash "$INPUT_COMMIT_HASH"
      shell: bash
      working-directory: apps/api
      env:
        INPUT_DIST: ${{ inputs.dist }}
        INPUT_PROJECT_NAME: ${{ inputs.project-name }}
        INPUT_BRANCH: ${{ inputs.branch }}
        INPUT_COMMIT_HASH: ${{ inputs.commit-hash }}
