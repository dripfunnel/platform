name: Deploy Pages project
description: Deploy an already-built SPA to a Cloudflare Pages branch

inputs:
  project-name:
    required: true
  dist:
    required: true
    description: Path to the built assets, relative to apps/api (e.g. ../ui/store/dist)
  branch:
    required: true
    description: Pages branch deploy name
  commit-hash:
    required: true

runs:
  using: composite
  steps:
    - run: |
        pnpm exec wrangler pages deploy "${{ inputs.dist }}" \
          --project-name "${{ inputs.project-name }}" \
          --branch "${{ inputs.branch }}" \
          --commit-hash "${{ inputs.commit-hash }}"
      shell: bash
      working-directory: apps/api
