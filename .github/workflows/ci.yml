name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    runs-on: self-hosted
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dripfunnel_dev
          POSTGRES_PASSWORD: dripfunnel_dev
          POSTGRES_DB: dripfunnel
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm turbo run build typecheck lint test
        env:
          DATABASE_URL: postgres://dripfunnel_dev:dripfunnel_dev@localhost:5432/dripfunnel
