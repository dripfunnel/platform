name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    runs-on: self-hosted
    # The runner's own Postgres 18, set up as docs/api/README.md §7 says (no Docker, AGENTS.md
    # Testing); tests create and drop a uniquely named database per run on it.
    env:
      DATABASE_URL: ${{ vars.CI_DATABASE_URL || 'postgres://dripfunnel_dev:dripfunnel_dev@localhost:5432/dripfunnel' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Postgres on the runner
        run: pg_isready -d "$DATABASE_URL"
      - run: pnpm turbo run build typecheck lint test
