name: claude-review

# A second pass on every pull request, stacked ones included, which fails closed: no verdict
# is no review (WORKFLOW.md §7). Claude Code runs in the job itself; see §7 for why not the action.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Secrets are not available to pull requests from forks, so the job would fail
    # rather than review. Everyone works on branches in this repo (WORKFLOW.md §2).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      VERDICT: ${{ github.workspace }}/.claude-review-verdict
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The head commit, not the merge ref, so a line Claude reads is the line an inline
      # comment anchors to.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Check the review can authenticate
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN}" ]; then
            echo "::error::The repository secret CLAUDE_CODE_OAUTH_TOKEN is not set, so the review cannot run. Mint one with 'claude setup-token' and add it under Settings → Secrets and variables → Actions (docs/code/THIRD-PARTY-ACCESS.md §2.6)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pinned: the next step hands this package a personal token (THIRD-PARTY-ACCESS.md §2.6).
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.287

      # The one write the review may make besides its summary: an inline comment on the head
      # commit. The model gets this script, never `gh api`.
      - name: Write the inline-comment helper
        run: |
          cat > "${RUNNER_TEMP}/inline-comment" <<'HELPER'
          #!/usr/bin/env bash
          # usage: inline-comment <path> <line> <body>
          set -euo pipefail
          gh api --method POST "repos/${GH_REPO}/pulls/${PR_NUMBER}/comments" \
            -f commit_id="${HEAD_SHA}" -f side=RIGHT -f path="$1" -F line="$2" -f body="$3" >/dev/null
          HELPER
          chmod 555 "${RUNNER_TEMP}/inline-comment"

      - name: Write the review prompt
        run: |
          cat > "${RUNNER_TEMP}/review-prompt.md" <<'PROMPT'
          Review pull request PR_NUMBER of REPOSITORY against **this repository's own rules**,
          not generic best practice. Its head commit (HEAD_SHA) is checked out in the working
          directory; `gh pr diff PR_NUMBER` shows what it changes and
          `gh pr view PR_NUMBER --json title,body --jq '.title, .body'` its description (ask for
          those two fields only: the job's token cannot read check statuses).

          Read first, before reviewing:
          - AGENTS.md — the rules for all work here
          - docs/code/WORKFLOW.md §7 — the reviewer's checklist. Use it as your checklist.
          - the documents the pull request description says it followed

          Weight your attention by blast radius. In order:

          1. **Tenancy.** Every tenant read and write goes through `db/scoped` with a
             TenantContext. No store, seller, brand or partner id is taken from the client
             as authority. Isolation tests exist for anything touching tenant data. A leak
             here includes counts, search results, empty states, exports and error
             messages.
          2. **Authorisation.** Every operation is authorised on the server. A hidden or
             disabled control is not access control.
          3. **Secrets and personal data.** Nothing secret in code, logs, error messages or
             client bundles. No personal data in logs.
          4. **Layers.** A folder imports only from its own layer or lower
             (docs/api/README.md §4); no deep imports across modules; the change sits in
             the lowest layer it belongs to.
          5. **Correctness.** Money is integer minor units with a currency, never a float
             or a bare number. Timestamps are UTC. Every list is paginated with a maximum
             page size. No N+1 queries. Parameterised queries only.
          6. **Reuse.** Nothing duplicated that already exists in the app's own modules or
             `apps/ui/shared/`. Code moves to `apps/ui/shared/` only when a second app
             uses it — never in advance.
          7. **UI.** Every designed state present (empty, loading, error, permission
             denied, read-only); text from `messages/`, never a literal; `--df-*` tokens,
             never a raw colour; keyboard and focus work; WCAG 2.2 AA.
          8. **Tests and docs.** Tests cover the rules, not only the happy path, and none
             was weakened to pass. A doc the change makes wrong is fixed in the same
             pull request.
          9. **Scope.** The change matches its card, and nothing from the card's
             "Not in this item" slipped in.

          How to report:
          - Only post GitHub comments, with `gh`. Do not write the review as a chat message.
          - A finding anchored to a line is an inline review comment on the head commit:
            `INLINE_COMMENT <file path from the repository root> <line number in the file as it is now> <the finding>`
            The line must be one the pull request's diff touches; otherwise put the finding in
            the summary with the file and line named.
          - Post one summary with `gh pr comment PR_NUMBER --body <text>`: what you checked and
            the headline findings. Say which tests you ran, or that you ran none.
          - **Say what is wrong and why it matters, with the input or state that breaks
            it.** No praise, no summary of what the code does, no restating the diff.
          - Raise something only if you would ask the author to change it. If you found
            nothing worth changing, say exactly that in one line.
          - You are a second pass, not the reviewer of record. A human still approves.

          **Last, and not optional: record your verdict.** After you have posted your
          comments, use the Write tool to write a file at the repository root called
          `.claude-review-verdict` containing exactly one word and nothing else:

          - `pass` — you found nothing you would ask the author to change.
          - `changes` — you found at least one thing you would ask them to change.

          This is the same bar as "Raise something only if you would ask the author to
          change it" above, so the verdict and your comments must agree: if you posted a
          finding, the verdict is `changes`.

          The check fails if this file is missing, because a review that did not finish
          is not a review that passed. Write it even if something went wrong earlier —
          and if you could not complete the review, write `changes` and say why in your
          summary comment.
          PROMPT
          sed -i "s|PR_NUMBER|${PR_NUMBER}|g; s|REPOSITORY|${GH_REPO}|g; s|HEAD_SHA|${HEAD_SHA}|g; s|INLINE_COMMENT|${RUNNER_TEMP}/inline-comment|g" "${RUNNER_TEMP}/review-prompt.md"

      # Read-only tools need no permission in print mode; the writes are the summary, the
      # inline-comment helper and the verdict file, and nothing else: `Write` is that one path.
      - name: Review
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "$(cat "${RUNNER_TEMP}/review-prompt.md")" \
            --output-format text \
            --allowedTools "Write(.claude-review-verdict),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(${RUNNER_TEMP}/inline-comment:*)"

      - name: Apply the review's verdict
        if: always()
        run: |
          if [ ! -f "${VERDICT}" ]; then
            echo "::error::The review did not record a verdict, so it did not finish. This is not a pass. Check the step above for what stopped it, then re-run the job."
            exit 1
          fi

          verdict="$(tr -d '[:space:]' < "${VERDICT}" | tr '[:upper:]' '[:lower:]')"

          case "${verdict}" in
            pass)
              echo "Claude found nothing it would ask the author to change."
              ;;
            changes)
              echo "::error::Claude asked for changes. Read its comments on this pull request, then fix each one or reply saying why not and push — the same loop WORKFLOW.md §7 describes for a human reviewer. Re-running this job is not the way past it."
              exit 1
              ;;
            *)
              echo "::error::The review wrote an unrecognised verdict (${verdict}). Expected 'pass' or 'changes'. Treating it as a failure rather than guessing."
              exit 1
              ;;
          esac
