name: retire-images

# Old core versions' studio images (storefront AI-STUDIO §9, #485): the API's daily job retires a version no store
# needs; this deletes its image from Cloudflare's registry, which only wrangler can do. ghcr.io's copy stays.

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retire-images
  cancel-in-progress: false

jobs:
  delete:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter ./apps/api release:retire
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          ALLOW_REMOTE_MIGRATIONS: '1'
          ALLOWED_MIGRATION_HOST: ${{ vars.ALLOWED_MIGRATION_HOST }}
