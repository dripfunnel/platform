name: Claude Code

# @claude in an issue or a pull request comment runs Claude (WORKFLOW.md §7). Comment events run
# from the default branch's copy of this file.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    steps:
      # A fork's branch is code nobody here could push, so Claude never runs on one (WORKFLOW.md §7).
      - name: Find the pull request's head
        id: pr
        if: github.event.issue.pull_request || github.event.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${NUMBER}" --jq .head.repo.full_name)"
          if [ "${head}" != "${GITHUB_REPOSITORY}" ]; then
            echo "::notice::Pull request ${NUMBER} comes from a fork, so Claude does not run on it."
            echo "fork=true" >> "${GITHUB_OUTPUT}"
          else
            echo "ref=refs/pull/${NUMBER}/head" >> "${GITHUB_OUTPUT}"
          fi

      # On a pull request, its head: the action reads the files it changes, which the default branch may lack.
      - name: Checkout repository
        if: steps.pr.outputs.fork != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      # Pinned to v1.0.247 since it holds the token. The flags ignore a checked-out branch's settings,
      # hooks and MCP servers, and keep reads out of token locations (WORKFLOW.md §7 says what they don't cover).
      - name: Run Claude Code
        if: steps.pr.outputs.fork != 'true'
        uses: anthropics/claude-code-action@2dca132ff0e0c4094ce6048b422c6915a071210b
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: >-
            --setting-sources user
            --strict-mcp-config
            --disallowedTools "Read(//proc/**),Read(//etc/**),Read(//root/**),Read(//home/**/.config/**),Read(//home/**/.claude/**),Read(//home/**/.npmrc),Read(//tmp/**),Read(//home/**/work/_temp/**),Read(.git/**),Grep(//proc/**),Grep(//home/**/.config/**),Grep(//home/**/.claude/**),Grep(//home/**/work/_temp/**),Grep(.git/**)"
