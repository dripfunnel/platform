name: Claude Code

# @claude in an issue or a pull request comment runs Claude (WORKFLOW.md §7). Comment events run
# from the default branch's copy of this file.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      # As in ci.yml's review: no checked-out file may configure Claude.
      - name: Drop the checkout's own Claude configuration
        run: rm -rf .claude .mcp.json .claude.json CLAUDE.md

      # Pinned to v1.0.247 since it holds the token; settings, hooks and MCP servers from any branch
      # it checks out are ignored, and reads kept from token locations, as in ci.yml (WORKFLOW.md §7).
      - name: Run Claude Code
        uses: anthropics/claude-code-action@2dca132ff0e0c4094ce6048b422c6915a071210b
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: >-
            --setting-sources user
            --strict-mcp-config
            --disallowedTools "Read(//proc/**),Read(//etc/**),Read(//root/**),Read(//home/**/.config/**),Read(//home/**/.claude/**),Read(//home/**/.npmrc),Read(//tmp/**),Read(//home/**/work/_temp/**),Read(.git/**),Grep(//proc/**),Grep(//home/**/.config/**),Grep(//home/**/.claude/**),Grep(//home/**/work/_temp/**),Grep(.git/**)"
