name: naming

# Only a renamed pull request: on a push, naming runs last in ci.yml's chain.
on:
  pull_request:
    types: [edited]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  naming:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/naming
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
