name: dev

# The persistent dev environment (ARCHITECTURE.md §6): the `dev` wrangler env, a Neon branch
# that is not created per push, and fixed Pages project names.

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  # Read-only, to ask whether the previous run of this workflow succeeded. Without that the
  # filter cannot tell a skipped app from a stale one.
  actions: read

concurrency:
  group: dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: apps/api
    steps:
      # The change filter needs the previous commit; the default checkout is shallow.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      # ARCHITECTURE.md §6. Fails safe: a redundant deploy costs a minute, a skipped one
      # leaves the environment stale while the run goes green.
      - name: What changed
        id: changed
        working-directory: .
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          everything() {
            for app in store platform admin api proxy; do echo "$app=true" >> "$GITHUB_OUTPUT"; done
          }

          if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "No usable base commit: deploying everything."
            everything
            exit 0
          fi

          # After a failed run the diff no longer describes the gap to the environment.
          # Empty means no previous run; a failed query means we do not know. Hence the exit
          # status rather than the string.
          if previous="$(gh run list --workflow dev.yml --branch "$GITHUB_REF_NAME" \
               --status completed --limit 1 --json conclusion --jq '.[0].conclusion // ""')"; then
            echo "Previous completed run: ${previous:-none}"
            if [ -n "$previous" ] && [ "$previous" != "success" ]; then
              echo "The previous run did not succeed, so what is deployed is unknown: deploying everything."
              everything
              exit 0
            fi
          else
            echo "Could not read the previous run's conclusion: deploying everything."
            everything
            exit 0
          fi

          files="$(git diff --name-only "$BEFORE" "$AFTER")"
          echo "Changed files:"; echo "$files" | sed 's/^/  /'

          # A root change can affect any build.
          if echo "$files" | grep -Eq '^(pnpm-lock\.yaml|pnpm-workspace\.yaml|package\.json|turbo\.json|tsconfig\.base\.json|eslint\.config\.js|\.github/)'; then
            echo "A root or workflow file changed: deploying everything."
            everything
            exit 0
          fi

          shared=false
          if echo "$files" | grep -q '^apps/ui/shared/'; then shared=true; fi
          for app in store platform admin; do
            if [ "$shared" = true ] || echo "$files" | grep -q "^apps/ui/$app/"; then
              echo "$app=true" >> "$GITHUB_OUTPUT"
            else
              echo "$app=false" >> "$GITHUB_OUTPUT"
            fi
          done
          if echo "$files" | grep -q '^apps/api/'; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$files" | grep -q '^store-proxy/'; then
            echo "proxy=true" >> "$GITHUB_OUTPUT"
          else
            echo "proxy=false" >> "$GITHUB_OUTPUT"
          fi

      # Gates and Migrations reuse the same host-guard code path with two different allowed
      # hosts. If those variables were ever set to the same value, Gates would silently be
      # allowed to migrate/write to the real dev database instead of the disposable test branch.
      - name: Guard rails
        env:
          ALLOWED_TEST_HOST: ${{ vars.ALLOWED_TEST_HOST }}
          ALLOWED_MIGRATION_HOST: ${{ vars.ALLOWED_MIGRATION_HOST }}
        run: |
          if [ -z "$ALLOWED_TEST_HOST" ] || [ -z "$ALLOWED_MIGRATION_HOST" ]; then
            echo "ALLOWED_TEST_HOST and ALLOWED_MIGRATION_HOST must both be set." >&2
            exit 1
          fi
          if [ "$ALLOWED_TEST_HOST" = "$ALLOWED_MIGRATION_HOST" ]; then
            echo "ALLOWED_TEST_HOST must not equal ALLOWED_MIGRATION_HOST: Gates must not be allowed to touch the dev database." >&2
            exit 1
          fi

      # The gates include runner.test.ts, which applies the migrations. Against a real Neon
      # branch that is the same privileged operation as the Migrations step below, so it runs
      # behind the same guard, pinned to the disposable test branch rather than the dev one.
      - name: Gates
        run: pnpm turbo run build typecheck lint test
        working-directory: .
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          ALLOW_REMOTE_MIGRATIONS: '1'
          ALLOWED_MIGRATION_HOST: ${{ vars.ALLOWED_TEST_HOST }}

      # Not filtered: `migrate` is a no-op when nothing is pending, and a failed run must be
      # retried by the next push whatever it touched.
      - name: Migrations
        run: pnpm run --if-present migrate
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          ALLOW_REMOTE_MIGRATIONS: '1'
          ALLOWED_MIGRATION_HOST: ${{ vars.ALLOWED_MIGRATION_HOST }}

      - name: 'SPA: store'
        if: steps.changed.outputs.store == 'true'
        uses: ./.github/actions/pages-deploy
        with:
          project-name: dripfunnel-store-dev
          dist: ../ui/store/dist
          branch: main
          commit-hash: ${{ github.sha }}

      - name: 'SPA: platform'
        if: steps.changed.outputs.platform == 'true'
        uses: ./.github/actions/pages-deploy
        with:
          project-name: dripfunnel-platform-dev
          dist: ../ui/platform/dist
          branch: main
          commit-hash: ${{ github.sha }}

      - name: 'SPA: admin'
        if: steps.changed.outputs.admin == 'true'
        uses: ./.github/actions/pages-deploy
        with:
          project-name: dripfunnel-admin-dev
          dist: ../ui/admin/dist
          branch: main
          commit-hash: ${{ github.sha }}

      - name: API Worker
        if: steps.changed.outputs.api == 'true'
        uses: ./.github/actions/worker-deploy
        with:
          env-name: dev
          message: ${{ github.sha }}

      # After the API Worker: the proxy's service binding needs `dripfunnel-api-dev` to exist.
      # It holds the zone's `*/*` route for partner portal hosts (SAAS.md §8).
      - name: Store proxy Worker
        if: steps.changed.outputs.proxy == 'true'
        uses: ./.github/actions/worker-deploy
        with:
          directory: store-proxy
          env-name: dev
          message: ${{ github.sha }}
